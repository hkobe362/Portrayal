format: 1
kind: module
name: dc-unstated
version: 1.0.0
class: psu
description: >-
  A synthetic -48 V supply whose source does not say which post is which, for the
  DC lint tests: both roles are unstated and stand in by position.
size: {w: 50, h: 40}
parts:
- {ref: fixture/dc-post@1, id: terminal-1, at: [10, 20]}
- {ref: fixture/dc-post@1, id: terminal-2, at: [30, 20]}
provenance:
  size: invented for a test
dc:
  ports:
  - id: input
    direction: input
    voltage: {nominal: -48}
    poles:
    - {role: unstated, slot: terminal-1, stand-in: {order: left-to-right}}
    - {role: unstated, slot: terminal-2, stand-in: {order: left-to-right}}
