format: 1
kind: device
name: xpu
version: 0.1.0
maturity: modelled
manufacturer: Fibrain
model: XPU00
description: >-
  HD patch panel frame, 1U, 19 in, 250 mm deep: an open steel frame with five
  plastic guide posts and eight slots, four across and two high, each taking
  one HD slot part - an adapter holder, a cassette or a blind cover. Sold
  empty, as XPU00 without grounding and XPS00 with grounding.
profile: optical
provenance:
  method:
    confidence: drawing
    note: >-
      THE FRONT IS MEASURED ON THE ENTITIES OF A 1:1 FRONT ELEVATION. Fibrain
      publishes a CAD libraries archive (hd.fibrain.com/dxf/cad-libraries.zip,
      files dated 2020-07-30) holding XPS00.dxf: AutoCAD 2007, units
      millimetres, one front elevation with no dimension entities and no text.
      Its extents are 484.60 x 43.955. Every x here counts from the outer edge
      of the left ear and every y from the top of those extents. Gate 1: the
      1U and 19 in of the datasheets against 43.96 and 484.60 (a rack face of
      482.6 is 0.4 percent under the drawing). The plan is the line drawing
      on page 2 of both datasheets, one image in both, 782 px across at 1.376
      px/mm: its 250 depth and its 435 body agree to 0.8 percent, so it is
      orthographic and coarse. Colour and construction are from the six
      vendor renders of XPU00 (XPU00_1 to _6, 2000 px, three-quarter views)
      and the product picture on each datasheet. THE DRAWING IS NAMED FOR
      XPS00 AND IS USED FOR BOTH: see `grounding`.
  chassis:
    confidence: drawing
    note: >-
      484.60 wide over the ears and 43.96 high, off the drawing; 250 deep, off
      both datasheets (DSH-XPU00 rev 2, 15.05.2020, and DSH-XPS00 rev 1,
      24.05.2020: height 1U, width 19 in, depth 250 mm, 1.2 kg). THE EARS ARE
      IN THE FACE: each is 24.70 wide and the frame between them 435.00, first
      post to last, so the front is drawn whole at 484.60 and no generic ear
      is added. The layers of the drawing name the ear as a rack bracket, a
      part of its own fixed to the frame side with pan-head screws; it is
      drawn as part of the face all the same, because the frame is not sold
      or shown without it.
  ears:
    confidence: drawing
    note: >-
      each ear 24.70 x 43.90 with its two outer corners rounded at 3.0 (the
      drawn patch runs 3.0 under the end post so that only those two show); one
      round hole 7.2 across, its centre 9.60 from the outer edge at mid
      height (22.0), and an obround slot 10.5 x 6.5 above and below it,
      centres 6.1 and 37.9, which is 31.8 apart. The two round holes are
      465.4 apart across the rack.
  posts:
    confidence: drawing
    note: >-
      five guide posts 7.01 wide on a 107.00 pitch, left edges 24.80, 131.80,
      238.80, 345.80 and 452.80, each 1.00 to 43.00 with a small tab to 0.00,
      in two tiers of 21.00. The drawing puts the third to fifth posts 0.005
      to 0.01 off that pitch, which is rounding in the file. Each tier
      carries a release latch 6.50 x 8.50, 3.20 below the top of the tier
      (4.20 to 12.70 and 25.20 to 33.70), and a small block 4.0 x 2.5 near
      its foot. The latches are red and the posts black on every render.
  slots:
    confidence: drawing
    note: >-
      eight openings, each 99.99 wide between two posts and 21.00 high, the
      upper row 1.00 to 22.00 and the lower 22.00 to 43.00. A bay is the 100 x
      21 envelope the holder datasheet states, centred on the opening, so it
      laps each post by 0.005.
  frame:
    confidence: drawing
    note: >-
      a top sheet 0.80 thick at 0.05 to 0.85 and a floor 0.80 thick at 43.15
      to 43.95, both 24.90 to 459.70. Behind the posts the drawing shows a
      slotted cross-member 19.0 high (12.5 to 31.5, lips 1.2 thick top and
      bottom) from 33.40 to 451.20, with twelve slots 20 x 4 on a 34.4 pitch
      at mid height, the first at 43.10. IT IS NOT DRAWN: it stands behind
      the face at a depth nothing states, an open slot is drawn as a dark
      mouth and a seated holder hides it.
  grounding:
    confidence: estimated
    note: >-
      WHAT GROUNDING CHANGES IS NOT DRAWN. One drawing exists and it is named
      XPS00. Its layers name an M4 press-in stud at each ear junction, an M3
      nut at the right one and pan-head screws at both, all edge-on slivers
      under 0.2 wide in a front elevation. The product picture on the XPS00
      datasheet shows a copper-coloured bar across the frame behind the
      posts, at the height of the cross-member, and a round yellow label on
      the right side wall near the rear; the picture on the XPU00 datasheet,
      from the same viewpoint, shows a dark member there and no label. Which
      of the drawn parts XPU00 lacks, and whether its cross-member is the
      same part unplated, no document says. Both configurations draw the same
      face, with the cross-member dark.
  numbering:
    confidence: estimated
    note: >-
      PROPOSED, NOT THE MAKER'S. Nothing is printed on the frame and no
      document numbers its slots. Slots count left to right along the upper
      row, 1 to 4, then along the lower row, 5 to 8, which is the order the
      holders of this family count their own two rows and the order the 0.5U
      panel fibrain/xcu counts its one row.
  rear:
    confidence: estimated
    note: >-
      NO REAR VIEW IS HELD. The rear is the front mirrored: the ears, the
      backs of the five posts, the edges of the top sheet and floor, and one
      open passage behind each slot through which a seated holder shows its
      back. The rear cable bar is drawn edge-on as a strip a millimetre thick
      at mid height, and the two side arms that carry it 16 high; both are
      read off the renders, which show the bar as a flat plate level with
      the middle of the frame.
  plan:
    confidence: estimated
    note: >-
      READ OFF THE DATASHEET PLAN AT 1.376 px/mm, so good to about a
      millimetre at best, and drawn in rectangles. Rear at y = 0. The rear
      bar is 29 deep across the 435 body and carries forty-eight tie slots in
      twelve groups of four, two nearer the rear and two nearer the front
      (counted on the plan; their size and spacing are schematic). A side arm
      7 wide joins each end of it to the front. The top sheet reaches 90 back
      from the face across the middle and 115.6 at each end; the slope
      between the two depths, about 40 long on the plan, is not drawn, and
      each end is drawn as a square wing 21 wide. The floor reaches 30.5 back
      across the middle and 52 at each end, the same way. Four pairs of slots
      22 x 3 in the top sheet, and a screw over each post, are placed from
      the plan.
  depth:
    confidence: estimated
    note: >-
      everything behind the face other than the 250 overall: no side or top
      CAD is published. The side views draw a side plate as deep as the top
      sheet, an arm and the end of the rear bar, all estimated off the
      renders.
  not-drawn:
    confidence: estimated
    note: >-
      no mark or legend is drawn because none is seen: the renders show a
      plain black frame with nothing printed on its front, so no logo zone is
      reserved. The optional front cable manager (ORG-HD-1U-0) and the label
      fields (XL00) are separate parts and are not modelled here. The side
      labels the vendor animation shows on the ears are not drawn.
attrs:
  physical:
    material: powder paint coated steel frame, plastic guides
    color: Black RAL 9005
  environmental:
    operating-temp: -40 to 70 C
    ingress-protection: IP 20 (EN 60529)
chassis:
  width: 484.6
  height: 43.96
  depth: 250.0
  ru: 1
  weight-kg: 1.2
  color: '#1b1e21'
  airflow: passive
gaps:
  - what: grounding
    scope: [front, rear, right]
    reason: needs-drawing
    note: >-
      the one drawing is named XPS00 and nothing separates what the grounded
      frame adds; the copper-coloured bar and the yellow label of the XPS00
      picture are not drawn, and the two configurations draw one face.
    wanted: >-
      a drawing or a square-on photograph of each of XPU00 and XPS00, or the
      parts list that says what XPS00 adds.
  - what: depth-and-rear
    scope: [rear, top, bottom, left, right]
    reason: needs-drawing
    note: >-
      no rear, side or top CAD is published; the rear is the front mirrored
      and the plan is read off a datasheet drawing at 1.376 px/mm.
    wanted: >-
      side and top views of XPS00 from the maker, whose CAD archive shows
      they exist.
  - what: slot-numbering
    scope: [front]
    reason: vendor-silent
    note: >-
      nothing numbers the slots; the order here is proposed, upper row first.
    wanted: >-
      a photograph of a labelled, installed frame, or the numbering
      convention of the maker.
groups:
  slots:
    term: Slot
    role: service
    index-origin: 1
    description: >-
      eight slots, four across and two high, each taking one HD slot part.
      Numbered left to right, the upper row first; the order is proposed, the
      frame prints none.
