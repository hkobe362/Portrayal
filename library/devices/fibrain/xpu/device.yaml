configurations:
  base:
    kind: base
    default: true
    description: >-
      The frame as both part numbers ship: empty, all eight slots open, the
      five guide posts in place.
  xpu00:
    kind: orderable
    part-numbers:
      XPU00: {part: XPU00}
    description: >-
      XPU00 - the frame without grounding, as it ships: empty, all eight slots
      open.
  xps00:
    kind: orderable
    part-numbers:
      XPS00: {part: XPS00}
    description: >-
      XPS00 - the frame with grounding, as it ships: empty, all eight slots
      open. Drawn as XPU00 is; see provenance.grounding.
  mixed:
    kind: example
    description: >-
      One of each holder kind in each row - 12 LC duplex, 12 SC/APC, 6 LC
      duplex and 6 SC/APC - to show the four slot fronts seated. Illustrative:
      holders are ordered separately from the frame.
    bays:
      slot-1: fibrain/xmn1021gb@1
      slot-2: fibrain/xmn1051gb@1
      slot-3: fibrain/xmi1021ga@1
      slot-4: fibrain/xmi1051ga@1
      slot-5: fibrain/xmn1051gb@1
      slot-6: fibrain/xmn1021gb@1
      slot-7: fibrain/xmi1051ga@1
      slot-8: fibrain/xmi1021ga@1
  lc-duplex-192:
    kind: example
    description: >-
      Eight 12-port LC duplex holders, the 192 fibres the datasheet gives as
      the most the frame holds. Illustrative.
    bays:
      slot-1: fibrain/xmn1021gb@1
      slot-2: fibrain/xmn1021gb@1
      slot-3: fibrain/xmn1021gb@1
      slot-4: fibrain/xmn1021gb@1
      slot-5: fibrain/xmn1021gb@1
      slot-6: fibrain/xmn1021gb@1
      slot-7: fibrain/xmn1021gb@1
      slot-8: fibrain/xmn1021gb@1
