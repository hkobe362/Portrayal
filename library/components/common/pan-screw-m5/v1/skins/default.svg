<svg xmlns="http://www.w3.org/2000/svg" width="9.5mm" height="9.5mm" viewBox="0 0 9.5 9.5">
  <!-- An M5 pan head, 9.5 across, head on, with its cross recess. The
       head is the whole art of the relief feature `head`. The head is black
       and so is what it is screwed to, so its rim is a light grey ring and a
       second, dimmer ring marks where the dome starts: the fill stays the
       part's own colour and the rim is what a reader sees. -->
  <g id="head">
    <circle cx="4.75" cy="4.75" r="4.6" fill="#1d1f22" stroke="#8a9099" stroke-width="0.3"/>
    <circle cx="4.75" cy="4.75" r="3.7" fill="none" stroke="#4a4f55" stroke-width="0.2"/>
    <path d="M 2.65 4.75 H 6.85 M 4.75 2.65 V 6.85"
          fill="none" stroke="#5a5f66" stroke-width="0.6" stroke-linecap="round"/>
  </g>
</svg>
