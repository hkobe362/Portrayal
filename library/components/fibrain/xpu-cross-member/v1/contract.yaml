format: 1
kind: component
name: xpu-cross-member
version: 1.0.0
class: mechanical
profile: optical
description: >-
  The cross-member behind the guide posts of the Fibrain HD 1U frame, seen
  from above. A slotted bar across the frame between the first and last post,
  at mid height. Dark on XPU00; copper-coloured on XPS00, where it is what the
  datasheet picture shows of the grounding. The colour is a field.
size: {w: 417.8, h: 6.0}
size-confidence: {w: drawing, h: estimated}
fields:
  finish:
    label: Finish
    type: text
    default: '#15171a'
elements:
  bar: {at: [0.0, 0.0], size: [417.8, 6.0], class: bezel}
relief:
  features:
    - node: bar
      lift: 10.4
      out: 29.4
      confidence: drawing
      source: 'the front elevation draws the member 12.5 to 31.5 from the top of the frame, 19.0 high; the heights here are those above the floor as it is drawn'
provenance:
  size: >-
    drawing across - measured on the entities of the CAD libraries archive Fibrain publishes (hd.fibrain.com/dxf/cad-libraries.zip, files dated 2020-07-30), `XPS00.dxf`: AutoCAD 2007, units millimetres, one 1:1 front elevation:
    behind the posts a member runs from 33.40 to 451.20, 19.0 high (12.5 to
    31.5) with a lip 1.2 thick top and bottom, and twelve slots 20 x 4 on a
    34.4 pitch at mid height, the first at 43.10. ESTIMATED FRONT TO BACK:
    it is drawn 6 deep, a channel, and 45 behind the face, just behind where
    the renders show the posts ending; no view gives either.
  finish: >-
    photo - the product picture on the XPS00 datasheet shows a copper-coloured
    bar across the frame behind the posts at this height, and the picture on
    the XPU00 datasheet, from the same viewpoint, a dark member there. WHETHER
    IT IS ONE PART IN TWO FINISHES OR A BAR ADDED TO A STEEL MEMBER, no
    document says; the one drawing is named for XPS00. It is modelled as one
    part with a `finish`, dark by default, which the XPS00 configuration sets
    to copper (#b87333, a nominal copper and not a sampled one).
  relief: >-
    drawing for the height, estimated for the depth - see the feature and
    `size`.
skins: [default]
