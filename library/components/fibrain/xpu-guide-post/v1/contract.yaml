format: 1
kind: component
name: xpu-guide-post
version: 1.0.0
class: mechanical
profile: optical
description: >-
  One guide post of the Fibrain HD 1U frame XPU00 / XPS00: the black plastic
  upright between two slot columns. It has two tiers, and each carries the red
  release latch of the slot parts either side.
size: {w: 7.01, h: 43.0}
size-confidence: {w: drawing, h: drawing}
elements:
  post: {at: [0.0, 1.0], size: [7.01, 42.0], class: bezel}
relief:
  features:
    - node: post
      out: 3.0
      color: '#101214'
      confidence: estimated
      source: 'the plan drawing of the datasheet shows each post standing a little in front of the plane of the ears, about four pixels at 1.376 px/mm; how far back it runs is not drawn here'
    - node: latch-1
      out: 3.4
      color: '#d92c1b'
      confidence: estimated
      source: 'the red release latch stands just proud of its post on the vendor renders; 0.4 is by eye'
    - node: latch-2
      out: 3.4
      color: '#d92c1b'
      confidence: estimated
      source: 'as latch-1'
provenance:
  size: >-
    drawing - measured on the entities of the CAD libraries archive Fibrain publishes (hd.fibrain.com/dxf/cad-libraries.zip, files dated 2020-07-30), `XPS00.dxf`: AutoCAD 2007, units millimetres, one 1:1 front elevation.
    Each of the five posts is 7.01 wide and runs 1.00 to 43.00, with a tab 1.0
    wide to 0.00 above it; two tiers of 21.00.
  size-latches: >-
    drawing - the same file: in each tier a release latch 6.50 x 8.50, 3.20
    below the top of the tier (4.20 to 12.70 and 25.20 to 33.70 of the frame),
    and a block 4.0 x 2.5 near the foot of the tier. The latch outline is
    drawn as a rounded rectangle; its moulded detail is not copied.
  color: >-
    photo - black posts and red latches on every vendor render of the frame
    (XPU00_1 to _6).
  relief: >-
    estimated - see the feature. THE POST's DEPTH BEHIND THE FACE IS NOT BUILT:
    no side view is published, and the renders show it running back about as
    far as a holder.
skins: [default]
