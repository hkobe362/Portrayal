name: xpu-cable-bar
version: 1.0.0
class: mechanical
profile: optical
description: >-
  The rear cable bar of the Fibrain HD 1U frame XPU00 / XPS00, seen from
  above. A stepped bar across the back of the frame: an upper strip at the
  rear, an upright, and a lower strip in front of it. Each strip carries a row
  of slots that cables are tied down to.
size: {w: 435.0, h: 29.0}
size-confidence: {w: estimated, h: estimated}
elements:
  upper: {at: [0.0, 0.0], size: [435.0, 14.5], class: bezel}
  lower: {at: [0.0, 14.5], size: [435.0, 14.5], class: bezel}
  upright: {at: [8.6, 13.9], size: [417.8, 1.2], class: bezel}
relief:
  features:
    - node: upper
      lift: 29.45
      out: 30.65
      color: '#1b1e21'
      confidence: drawing
      source: 'the upper lip of the band on the front elevation, 12.5 to 13.7 from the top of the frame, read as the upper strip seen edge on; how far back it runs is estimated'
    - node: upright
      lift: 11.65
