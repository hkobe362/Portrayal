provenance:
  size: >-
    drawing across, datasheet deep - the 435.00 between the ears off the front
    elevation (the CAD libraries archive Fibrain publishes (hd.fibrain.com/dxf/cad-libraries.zip, files dated 2020-07-30), `XPS00.dxf`: AutoCAD 2007, units millimetres, one 1:1 front elevation),
    and the 250 depth of both datasheets.
  size-outline: >-
    estimated - the front and plan line drawing on page 2 of DSH-XPU00 rev 2 (15.05.2020) and DSH-XPS00 rev 1 (24.05.2020), one image in both, 782 px across at 1.376 px/mm.
    The floor sheet reaches 30.5 back from the face across the middle and 52
    at each end, with a slope about 27 long between the two depths starting 7
    in from each side. Read to a pixel, 0.7 mm, on a drawing that coarse.
  depth: >-
    drawing - the front elevation has the floor sheet 0.80 thick at 43.15 to
    43.95 of a 43.955 envelope, so its top is 43.15 down. IT IS DRAWN AT 41.9:
    a well is built no nearer the far side than 2 mm, so the floor stands 1.25
    high.
  color: >-
    photo - black, as the frame is on every vendor render.
