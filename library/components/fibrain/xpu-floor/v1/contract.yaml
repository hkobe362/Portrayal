name: xpu-floor
version: 1.0.0
class: mechanical
profile: optical
description: >-
  The inside of the Fibrain HD 1U frame XPU00 / XPS00 seen from above - the
  space between its two sides, open above behind the top sheet, open below
  behind the floor and open at the rear - drawn as the well its floor sheet
  lies at the bottom of. The floor is the strip across the front under the
  slot parts.
