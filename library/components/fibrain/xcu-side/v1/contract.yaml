provenance:
  size: >-
    estimated - the shell between its side walls is the 429.35 wide well of
    fibrain/xcu-interior@1 inside a body 431.35 wide, so each wall is 1.0 of
    sheet, and it runs the 283.0 of that well from the front opening to where
    the rear would be. No document states the sheet's thickness: the XPU00
    frame's top sheet and floor are 0.8 on its drawing, and a whole millimetre is
    the figure the XCU interior already assumes.
  relief: >-
    estimated - a wall from the floor of the well to the top sheet. The
    datasheet gives the 284 depth and the 0.5U height and no section.
  color: >-
    photo - powder-painted black steel on the vendor renders, as the shell's top.
