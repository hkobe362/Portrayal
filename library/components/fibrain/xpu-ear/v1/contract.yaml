description: >-
  One rack ear of the Fibrain HD 1U frame XPU00 / XPS00 - a bracket fixed to
  the side of the frame, its face in the plane of the rack rails, with a round
  hole between two obround slots for the rack screws. Drawn as the left ear;
  the right one is this part turned half a turn.
