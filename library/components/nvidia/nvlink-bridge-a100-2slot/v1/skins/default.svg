<svg xmlns="http://www.w3.org/2000/svg" width="47.24mm" height="49.5mm" viewBox="0 0 47.24 49.5">
  <!-- The bridge seen from above: a bar 47.24 across, from the centre of one
       connector's width to the centre of the other's plus a half each side, with
       a plug at each end over the connector (6.6 wide, 3.3 in from the edge
       to its centre line). Body only: no printed mark is held. -->
  <path id="body" fill="#202225" stroke="#4a4d52" stroke-width="0.15"
        d="M 0 1.5 Q 0 0 1.5 0 H 45.74 Q 47.24 0 47.24 1.5 V 48 Q 47.24 49.5 45.74 49.5 H 1.5 Q 0 49.5 0 48 Z"/>
  <!-- the plug ends, over the two connectors -->
  <rect x="0" y="0" width="6.6" height="49.5" fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12"/>
  <rect x="40.64" y="0" width="6.6" height="49.5" fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12"/>
</svg>
