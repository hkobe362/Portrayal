       mm behind the bracket's outer face, so the far end is at the top and the
       bracket's end at the bottom. Matte black, lighter toward the bracket, with a
       field of 25 horizontal vent slits near the bracket and the blower's opening:
       a dark ring 59.9 across centred 47.8 from the far end and 46.0 below the top
       edge (PNY's side photograph at 2.93 px/mm, provenance body-fan), with a
       dark hub and 44 curved blades. Drawn in-house; nothing is traced. -->
