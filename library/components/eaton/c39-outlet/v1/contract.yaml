format: 1
kind: component
name: c39-outlet
version: 1.1.0
class: inlet
profile: power
interface: eaton-c39
description: >-
  Eaton's C39 outlet on a Rack PDU G4 - a proprietary combination of the C13 and
  C19 outlets that takes either a C14 or a C20 plug, with high retention. A rounded
  recess with a cross-shaped nose and three contacts.
size: {w: 35.4, h: 26.6, d: 20}
size-confidence: {w: drawing, h: drawing, d: registry}
attrs: {outlet: eaton-c39, media: ac, rating-a: 16, accepts: 'C14, C20'}
provenance:
  method: >-
    drawing - Eaton drawing 9001-22301 (EVMI2130X, first issue 18-Aug-2023, D size,
    scale 0.400) is vector, so the outlets were read from its path geometry at
    1.133858 pt/mm rather than off a raster; the 1730, 1555.8, 72.00 and 55.80
    dimensions on the same sheet all land within 0.02 mm at that scale. The drawing
    lies the PDU down, cord end left; this part is drawn as the PDU stands, cord end
    down, so the drawing's length runs up the part and its width across it.
  size: >-
    drawing - the recess on 9001-22301, 26.6 along the PDU by 35.4 across (the first
    C39 of section A spans x 221.64 to 248.24 and y 6.6 to 42.0 in drawing mm), with
    R4.5 corners; the nose inside it 15.6 by 22.75 with the C19 earth lobe
    standing out of one side and a notch in the other.
  identity: >-
    datasheet - the G4 installation and setup guide P-164001156 rev 3, section 1.5,
    "Eaton C39 with High Retention": a proprietary Eaton combination outlet, a
    combination of the C13 and C19 styles designed to accept both C14 and C20 plugs,
    with native high retention. Not an IEC 60320 sheet, which is why it is an eaton/
    part and not a std/ one; the drawing calls it EATON C39 - COMBO C13/C19, and both
    DCIM targets carry it as the outlet type `eaton-c39`, label Eaton C39.
  rating: >-
    drawing - 9001-22301 OUTPUT RATING: 16A PER C39.
  depth: >-
    registry - the `c19-plug` entry of spec/schemas/standards.yaml (Volex VAC19,
    Aug-2025 catalogue p.262) gives a C19's nose as 20 (MIN) long. The C39 takes a
    C20 plug, whose shroud swallows a C19's nose, so its well is at least that deep:
    20. The check from the other side is std/c20-inlet@1's cavity, 19.0 (itself
    estimated from the same nose less 1), which goes 19 into this well and does not
    bottom out; a C14 plug, 17, goes less far. No Eaton drawing or photograph held
    shows the C39 in section.
  interface: >-
    `eaton-c39` in spec/schemas/connectors.yaml (#1045), the name both DCIM
    targets give the outlet type. No standard is cited there: the C39 is no
    IEC 60320 sheet. Two cord ends mate it and seat at `mate`:
    generic/c14-plug@1 and generic/c20-plug@1, the two plugs section 1.5 of
    P-164001156 rev 3 says the outlet is designed to take.
  mate: >-
    estimated - (17.7, 13.7), ONE POINT FOR TWO PLUGS. A C14 shroud, 24 by 16
    inside, goes over the nose, 22.75 by 15.6, whose centre on 9001-22301 is
    (17.73, 13.74). A C20 body, 33.75 by 25.75, fills the well, 35.4 by 26.6,
    whose centre is (17.7, 13.3). The point is the centre of the nose, moved
    0.04 so that a C20 seated on it stays inside the well. A C14 seated on it
    is 0.04 off the nose, inside its 0.2 of play. No Eaton drawing held shows
    either plug seated.
  media: >-
    `media: ac` (#1045): an outlet states what it hands on, as
    std/c14-inlet@1 states what it takes. `outlet` is the DCIM type and says
    which way power runs; it does not say AC.
  keys: >-
    drawing and photo - 9001-22301 draws a lens-shaped key across each corner of the
    well at the end away from the cord, and EVMI2130X-OUTLET-BANK_C5 shows them as
    raised wedges standing in the well. They are cut out of the well with the nose,
    so they stand to the face. THAT HEIGHT IS ASSUMED: no drawing dimensions it,
    and the photograph, which shows their tops lit level with the nose's, is
    consistent with face height without measuring it.
  relief: >-
    drawing - THE WELL IS THE RECESS OUTLINE, NOT ITS BOX. `relief.cavity` names
    the `recess` path - the R4.5 outline traced off 9001-22301 with the cross-shaped
    nose and the two keys cut out of it - so the 3D walls follow the outline, the
    nose's notch and lobe, and the keys (kit/relief.js outlineWalls).
elements:
  recess: {at: [0, 0], size: [35.4, 26.6], class: inlet}
relief:
  wall: '#1a1b1d'
  cavity: recess
connection-points:
  mate: {at: [17.7, 13.7], direction: front}
skins: [default]
