<svg xmlns="http://www.w3.org/2000/svg" width="20.85mm" height="11.7mm" viewBox="0 0 20.85 11.7">
  <!-- Drawn from the cable end, as a front elevation sees a seated plug.
       Farthest from the viewer first. -->
  <!-- The housing, 20.85 x 11.70: the six-wide power block with the narrower
       sense row stepping in below it (Molex 2191140001-SD). -->
  <path id="body" fill="#202225" stroke="#4a4d52" stroke-width="0.12"
        d="M 0 0 H 20.85 V 7.8 H 17.85 L 16.85 11.7 H 4 L 3 7.8 H 0 Z"/>
  <!-- The wire bundle; radius is half the default cable-od (10.0). -->
  <circle id="stub" cx="10.425" cy="5.85" r="5.0"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
