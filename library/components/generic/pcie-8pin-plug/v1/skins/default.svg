<svg xmlns="http://www.w3.org/2000/svg" width="12.6mm" height="18mm" viewBox="0 0 12.6 18">
  <!-- Drawn from the cable end, as a front elevation sees a seated plug.
       Farthest from the viewer first. -->
  <!-- The housing, 12.6 x 18.0, with the PCIe polarisation corner cut. -->
  <path id="body" fill="#202225" stroke="#4a4d52" stroke-width="0.12"
        d="M 0 0 H 12.6 V 18 H 2 L 0 16 Z"/>
  <!-- The wire bundle; radius is half the default cable-od (9.0). -->
  <circle id="stub" cx="6.3" cy="9" r="4.5"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
