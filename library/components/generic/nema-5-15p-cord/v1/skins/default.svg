<svg xmlns="http://www.w3.org/2000/svg" width="26mm" height="24.7mm" viewBox="0 0 26 24.7">
  <!-- A moulded NEMA 5-15P cord cap, drawn from the cable end, as a front
       elevation sees it seated in a receptacle, in std/nema-5-20r@1's own
       convention: earth up, so the round nose that carries the earth pin is
       at the top and the flat edge at the bottom. A plain generic body: no
       maker's mark, no grip pattern. Farthest from the viewer first. Each
       node is the whole art of its relief feature. -->
  <!-- The front of the moulding, 26 across the blades by 24.7: a 14.0
       rectangle with R2 corners, two concave R14 flanks and the R6.5 nose
       (Volex PS204, catalogue Aug-2025 p.147). -->
  <path id="body" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"
        d="M 2 24.7 H 24 A 2 2 0 0 0 26 22.7 V 14.15 Q 26 12.15 24 10.7 A 14 14 0 0 1 19.094 4.24 A 6.5 6.5 0 0 0 6.906 4.24 A 14 14 0 0 1 2 10.7 Q 0 12.15 0 14.15 V 22.7 A 2 2 0 0 0 2 24.7 Z"/>
  <!-- Its tapering rear, built as one step: 20 across, and the 14.5 the
       moulding keeps on the earth axis once the nose has sloped away. -->
  <rect id="body-rear" x="3" y="10.2" width="20" height="14.5" rx="2"
        fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The strain relief, 14.5 across by about 11, on the blade line. -->
  <rect id="relief-boot" x="5.75" y="12.4" width="14.5" height="11" rx="3"
        fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cord. Its drawn radius is half the default cable-od (8.33); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="13" cy="17.9" r="4.165"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
