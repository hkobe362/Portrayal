<svg xmlns="http://www.w3.org/2000/svg" width="31.2mm" height="29.8mm" viewBox="0 0 31.2 29.8">
  <!-- A moulded NEMA 5-20P cord cap, drawn from the cable end, as a front
       elevation sees it seated in a receptacle, in std/nema-5-20r@1's own
       convention: earth up, so the lobe that carries the earth pin is at the
       top and the flat edge at the bottom. A plain generic body: no maker's
       mark, no grip pattern. Farthest from the viewer first. Each node is
       the whole art of its relief feature. -->
  <!-- The front of the moulding, 31.2 across the blades by 29.8 (Volex
       PS520, catalogue Aug-2025 p.159, dimensioned): a 15.4 rectangle, two
       rounded shoulders and the lobe round the earth pin, those three scaled
       off the same face view. -->
  <path id="body" fill="#26282b" stroke="#4a4d52" stroke-width="0.12"
        d="M 2 29.8 H 29.2 A 2 2 0 0 0 31.2 27.8 V 14.4 Q 31.2 8.3 26.6 6.5 L 22.945 6.5 A 7.4 7.4 0 0 0 8.255 6.5 L 4.6 6.5 Q 0 8.3 0 14.4 V 27.8 A 2 2 0 0 0 2 29.8 Z"/>
  <!-- Its tapering rear, built as one step: 28 across, the middle of the
       taper, from 2.0 below the shoulders, so that it stays inside the front. -->
  <rect id="body-rear" x="1.6" y="8.5" width="28" height="17.3" rx="4"
        fill="#2c2e32" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The strain relief, about 16.5 across. -->
  <circle id="relief-boot" cx="15.6" cy="14.3" r="8.25"
          fill="#202225" stroke="#4a4d52" stroke-width="0.12"/>
  <!-- The cord. Its drawn radius is half the default cable-od (9.65); a
       wrapper's or a placement's cable-od resizes it. -->
  <circle id="stub" cx="15.6" cy="14.3" r="4.825"
          fill="#1c1c1c" stroke="#4a4d52" stroke-width="0.12"
          data-r-from="cable-od" data-fill-from="jacket-color"/>
</svg>
