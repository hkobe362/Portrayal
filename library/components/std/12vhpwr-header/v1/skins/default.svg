<svg xmlns="http://www.w3.org/2000/svg" width="20.85mm" height="11.7mm" viewBox="0 0 20.85 11.7">
  <!-- aperture: the plug's outline, 20.85 x 11.70 (Molex 2191140001-SD rev A): the
       six-wide power block with the narrower sense row stepping in below it -->
  <path id="opening" fill="#23262b"
        d="M 0 0 H 20.85 V 7.8 H 17.85 L 16.85 11.7 H 4 L 3 7.8 H 0 Z"/>
  <!-- cavity: sixteen cells, each its own opening, as sixteen subpaths: twelve power
       cells (2.4 square) on a 3.00 pitch, then the four smaller sense cells (1.6
       square) on a 2.00 pitch under them. -->
  <path id="inlet-face" fill="#08090a"
        d="M 1.725 1.4 H 4.125 V 3.8 H 1.725 Z M 4.725 1.4 H 7.125 V 3.8 H 4.725 Z M 7.725 1.4 H 10.125 V 3.8 H 7.725 Z M 10.725 1.4 H 13.125 V 3.8 H 10.725 Z M 13.725 1.4 H 16.125 V 3.8 H 13.725 Z M 16.725 1.4 H 19.125 V 3.8 H 16.725 Z M 1.725 4.4 H 4.125 V 6.8 H 1.725 Z M 4.725 4.4 H 7.125 V 6.8 H 4.725 Z M 7.725 4.4 H 10.125 V 6.8 H 7.725 Z M 10.725 4.4 H 13.125 V 6.8 H 10.725 Z M 13.725 4.4 H 16.125 V 6.8 H 13.725 Z M 16.725 4.4 H 19.125 V 6.8 H 16.725 Z M 6.625 8.3 H 8.225 V 9.9 H 6.625 Z M 8.625 8.3 H 10.225 V 9.9 H 8.625 Z M 10.625 8.3 H 12.225 V 9.9 H 10.625 Z M 12.625 8.3 H 14.225 V 9.9 H 12.625 Z"/>
  <!-- the latch ramp along the housing's top wall, a wedge -->
  <rect id="latch" x="7" y="0.1" width="6.8" height="1" fill="#2c3036" stroke="#3a3e43" stroke-width="0.08"/>
  <!-- a contact pin standing in each cell -->
  <g fill="#b9bfc6">
    <rect id="pin-1" x="2.525" y="2.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-2" x="5.525" y="2.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-3" x="8.525" y="2.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-4" x="11.525" y="2.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-5" x="14.525" y="2.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-6" x="17.525" y="2.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-7" x="2.525" y="5.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-8" x="5.525" y="5.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-9" x="8.525" y="5.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-10" x="11.525" y="5.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-11" x="14.525" y="5.2" width="0.8" height="0.8" rx="0.15"/>
    <rect id="pin-12" x="17.525" y="5.2" width="0.8" height="0.8" rx="0.15"/>
    <!-- the sense contacts, 2.00 pitch -->
    <rect id="sense-1" x="7.025" y="8.7" width="0.8" height="0.8" rx="0.15"/>
    <rect id="sense-2" x="9.025" y="8.7" width="0.8" height="0.8" rx="0.15"/>
    <rect id="sense-3" x="11.025" y="8.7" width="0.8" height="0.8" rx="0.15"/>
    <rect id="sense-4" x="13.025" y="8.7" width="0.8" height="0.8" rx="0.15"/>
  </g>
</svg>
