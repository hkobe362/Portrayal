format: 1
kind: component
name: 12vhpwr-header
version: 1.0.0
class: inlet
profile: server
conforms: pcie-16pin-header
interface: pcie-12vhpwr
description: >-
  The 16-pin 12VHPWR GPU power connector of PCIe CEM 5.0 and ATX 3.0 on a board,
  seen end on from the cable side. It has twelve power contacts on a 3.00 pitch
  and four sense contacts below them. It presents `pcie-12vhpwr`, which
  generic/pcie-16pin-plug@1 mates. A CEM 5.1 card uses std/12v-2x6-header@1.
size: {w: 20.85, h: 11.7, d: 9.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
size-notes: the opening is taken as the plug's own outline; no header drawing was readable
unplaced: a GPU card composes it; the 16-pin cards are not modelled to (docs/connectors-gpu-design.md section 7)
attrs:
  media: pcie-12vhpwr
  input: dc
  pins: 16
  pins-power: 12
  pins-sense: 4
  pitch-mm: 3.0
  power-rated-w: 600
provenance:
  size: >-
    estimated - registry `pcie-16pin-header`. The opening is the cable housing's
    outline, 20.85 x 11.7 (the height is read between two figures on the
    drawing), from Molex customer drawing 2191140001-SD rev A (2024-03-11),
    which is the plug that enters it. The header's own shroud is
    not dimensioned in anything held. The Amphenol Minitek Pwr CEM-5
    specification GS-12-1706 and Molex's header pages could not be downloaded.
  depth: >-
    estimated - 9.0 is a guess at the shroud's depth, bounded above by the
    plug's 14.00.
  contacts: >-
    drawing - Molex 2191140001-SD: 12 power cells in two rows of six, 3.00 pitch
    both ways (15.00 across the outer six), 4 sense cells on a 2.00 pitch (6.00
    across the outer four). The header's contacts are taken at the plug's centres.
  variant: >-
    datasheet - Wikipedia "12VHPWR": 12VHPWR is marked "H+", the CEM 5.0
    connector with twelve power and four sense contacts, 600 W. 12V-2x6 (CEM 5.1,
    ECN 6.0) changed only the board and supply sockets. A secondary source;
    PCI-SIG's specification is not held.
  power: >-
    datasheet - 600 W at 12 V. Amphenol GS-12-1706, as Mouser quotes it, rates a
    power contact 9.5 A with all twelve energised and a signal contact 1 A.
elements:
  opening: {at: [0.0, 0.0], size: [20.85, 11.7], class: cutout}
relief:
  wall: '#141619'
  cavity: inlet-face
connection-points:
  mate: {at: [10.425, 5.85], direction: front}
skins: [default]
