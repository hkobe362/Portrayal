    <rect x="3.4" y="10.5" width="1.6" height="1.6" rx="0.2"/>
    <rect x="7.6" y="10.5" width="1.6" height="1.6" rx="0.2"/>
    <rect x="3.4" y="14.7" width="1.6" height="1.6" rx="0.2"/>
    <rect x="7.6" y="14.7" width="1.6" height="1.6" rx="0.2"/>
  </g>
