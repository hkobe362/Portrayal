  <rect id="fold-left" x="0" y="8.4" width="1.22" height="26.9" fill="#25272a"/>
  <rect id="fold-right" x="441.48" y="8.4" width="1.22" height="26.9" fill="#25272a"/>
  <rect id="plate" x="0" y="0" width="442.7" height="43.7" rx="1.2" fill="#2a2c2f"/>
