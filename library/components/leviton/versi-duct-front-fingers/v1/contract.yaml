format: 1
kind: component
name: versi-duct-front-fingers
version: 1.0.0
class: mechanical
description: >-
  One wall of fingers of a Leviton VERSI-DUCT horizontal duct's front channel seen from the
  front - the PVC wall along the top or bottom of the channel, ten fingers end-on with a
  slot a patch cord is laid in through between each pair. The same part on the 491RU-HFR,
  492RU-HFR and 492RU-HFO, at the top and at the bottom of the channel.
provenance:
  size: >-
    drawing - the top view of Leviton's 492RU-HFR dimensional drawing (DXF): nine slots 22.45
    mm wide on a 49.375 mm pitch, the first from 32.65 to 55.10 on the drawing and the last
    from 427.65 to 450.10, symmetric about the middle of the 444.5 mm between the plate's
    folds (19.15 to 463.65), so the fingers between them are 26.925 wide and the two end
    fingers 13.5 and 13.55 to the duct's ends. The 491RU-HFR's top view draws the same nine
    slots at the same places. The wall is 2.54 mm [0.1 in] thick: the side view's wall
    lines (6.03 to 8.57 and 79.69 to 82.23 on the 492RU-HFR, 4.91 to 7.45 and 40.47 to 43.01
    on the 491RU-HFR).
  relief: >-
    drawing - the top view: the slots run from the tips of the fingers, 24.15 mm from the
    front of the duct (on the 492RU-HFR, the 491RU-HFR's are 0.48 nearer the front with its
    plate), back to the mounting plate, where each ends in a rounded root; a finger
    therefore stands from the plate's face to 57.25 mm out of it on the 492RU-HFR, whose
    plate's front face is 81.4 from the front. Built as plates with square corners where the
    drawing shows the tip flared to take the cover and the slots rounded at the root.
  color: >-
    datasheet - "PVC rated for 94V-0" for the material (Versi-Duct specification sheet); the
    ducts are sold "with black covers". Every drawing is line work, so the shade is this
    library's render of black PVC.
