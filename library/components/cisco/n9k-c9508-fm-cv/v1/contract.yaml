provenance:
  size: >-
    estimated - the guide gives dimensions for the fabric module (2.46 in by 16.4 in by 11.7 in) and none
    for its blank, so the blank takes the fabric module's slot envelope.
  purpose: >-
    install guide - "Overview" note: "When using any fabric modules other than N9K-C9508-FM-G, any empty
    slots should be filled with N9K-C9508-FM-CV cards"; "Migrating the Switch ..." names N9K-C95xx-FM-CV.
    The coverage list of the intake names N9K-C9508-FM-CV among parts that appear in the guides and are not
    in its model list.
  conflict: >-
    Table 1 of the same guide names N9K-C9508-FM-Z for the empty slot of the same fabric types; see
    cisco/n9k-c9508-fm-z. Which of the two Cisco ships is not stated; both are accepted.
  skin: >-
    estimated - a plain unpunched plate with two captive screws; no figure draws the blank.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number.
