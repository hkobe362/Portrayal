name: n9k-c9508-fm-z
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Cisco Nexus 9508 fabric blank module with a fan-tray power connector (N9K-C9508-FM-Z). It fills a
  fabric-module slot that holds no fabric module and passes power to the fan tray in front of it. Table 1
  of the guide pairs it with the N9K-C9508-FM, -FM-E, -FM-E2 and -FM-R fabric modules and the N9K-C9508-FAN
  tray. Fabric slots FM 2, FM 4 and FM 6 must hold a fabric module or this blank to power their fan tray.
