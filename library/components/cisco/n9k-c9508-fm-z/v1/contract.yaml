  model: 'N9K-C9508-FM-Z'
  role: 'airflow-blank'
  eol: 'unknown'
provenance:
  size: >-
    estimated - the guide gives dimensions for the fabric module (2.46 in by 16.4 in by 11.7 in) and none
    for its blank. The blank takes the fabric module's slot, so it takes that envelope.
  purpose: >-
    install guide - "Overview", Table 1 "Compatibility of Fabric Modules, Fans, and Fabric Module
    Blanks/Fan Power Cards" lists N9K-C9508-FM-Z against N9K-C9508-FM, -FM-E, -FM-E2 and -FM-R; "Fan Tray
    LEDs" calls it a "fabric blank module with fan tray power connector (N9K-C9508-FM-Z)" and says the even
    numbered fabric slot behind a fan tray needs a working fabric module or this blank to power the tray.
  conflict: >-
    the same guide also says "any empty slots should be filled with N9K-C9508-FM-CV cards" (Overview note)
    where Table 1 says N9K-C9508-FM-Z. Both part numbers are modelled and neither is dropped; see
    cisco/n9k-c9508-fm-cv.
  skin: >-
    estimated - a plain plate with a power connector and two captive screws; no figure draws the blank.
  lifecycle: >-
    unknown - Cisco's support page gives no sale status for this part number.
