  <rect id="top" x="0" y="0" width="5.715" height="5.715" rx="2.8" fill="#3a3f45"/>
  <rect id="bottom" x="0" y="83.185" width="5.715" height="5.715" rx="2.8" fill="#3a3f45"/>
</svg>
