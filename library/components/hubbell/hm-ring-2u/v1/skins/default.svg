<svg xmlns="http://www.w3.org/2000/svg" width="5.715mm" height="88.9mm" viewBox="0 0 5.715 88.9">
  <!-- one wire ring end-on: the loop runs back from the viewer to the plate; its top wire,
       its bottom wire and the post at the free end -->
