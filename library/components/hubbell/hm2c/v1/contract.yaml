format: 1
kind: component
name: hm2c
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The hinged, removable cover of the Hubbell M-Series 2 RU cable manager, catalogue HM2C.
  The HM24C sheet lists it as the replacement cover. It is a steel panel across the front
  of the wire rings. It opens, or lifts off its hinge, so patch cords can be added.
provenance:
  size: >-
    datasheet - the HM24C sheet lists "Replacement Cover, 2U HM2C" and draws the cover the
    width of the manager, B, 19 in (483 mm). Its height is estimated as the plate's, A, 3.5
    in (89 mm): the sheet's photograph shows a front panel the full height of the rings, and
    the figure draws it open as a sheet as wide as the plate.
  relief: >-
    estimated - a flat panel 1.5 mm thick standing at the very front of the rings, C out
    of the plate. The figure shows a folded edge along it and the photograph a lip along
    the top; neither is dimensioned and neither is drawn.
  lid: >-
    datasheet - "Cover: Included, hinged & removable" on the sheet, and "Door hinges and is
    removeable to allow for easy addition of patch cords" in its features; the figure draws
    the cover swung open on a dashed arc. It opens over the plate's windows, so it is a lid
    (`lid: true`) and the windows beneath it may be declared pass-throughs. The format has
    no hinge, so the cover is drawn fitted, one panel; the device's `cover-hinge` gap says so.
  color: >-
    datasheet - "Finish: Black Powder Coated", the sheet's, for the whole manager.
  logo-zone: >-
    reserved, not drawn, estimated - the photograph shows the maker's name plate at the
    middle of the cover, about 58 mm wide and 12 mm high, read against the cover's 483 mm
    length. The library reproduces no vendor logo.
