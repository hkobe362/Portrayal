format: 1
kind: module
name: 7050x4-pwr-1500-dc
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 1500 W DC power supply of the Arista 7050DX4-32S, 7050PX4-32S, 7050DX4M-32S and 7050CX4M-48D8,
  PWR-1511-DC-RED (forward airflow, red handle). It is a 1RU module, 73.5 mm wide, with the fan guard
  and red diagonal handle of the AC supply and a terminal block in place of its inlet. The block has
  the two poles the guide's section 4.4.2.2 names, negative (-48V) and positive (RTN). The protective
  earth terminal is on the other side of the module and is not drawn.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-1511-DC-RED: {part: PWR-1511-DC-RED}
attrs:
  power-output-w: 1500
  input: dc
  inlet: dc-terminal
  airflow: front-to-back
  input-note: '-48 to -60 VDC, 38.0 A'
provenance:
  size: >-
    datasheet for the width, estimated for the height, as arista/7050x4-pwr-1500-ac: the 7050X4 Series
    Data Sheet (03-0057-27) describes the part as "PWR-1511-DC-RED  Arista PSU, 1RU, DC/DC, 1500W,
    FORWARD, 73.5MM".
  part-number: >-
    datasheet - optional components and spares: "PWR-1511-DC-RED  Arista PSU, 1RU, DC/DC, 1500W,
    FORWARD, 73.5MM". The datasheet lists no DCS-7050 SKU for a DC build (the -F and -R SKUs are
    "2xAC"): the DC supply is a spare and the "#" configurable orders take it. The guide's table 3
    lists PWR-1511-DC and table 4 gives it as a supported supply of the DX4-32S, PX4-32S, DX4M-32S
    and CX4M-48D8.
  power-output: >-
    datasheet - the "1500W" of the ordering description and "Output Power 1500W" in the power supply
    table. An output.
  input: >-
    datasheet - guide table 3: PWR-1511-DC "-48 to -60 VDC, 38.0 A"; the datasheet's power supply
    table gives "-48 to -60 VDC", "35.2A Max (-48V)", 92 percent efficiency and "AWG #6 Max". The two
    documents state the current differently (38.0 against 35.2 A); the guide's is written. The guide's
    table 7 gives the wire as 4 to 6 AWG (25.0 to 16.0 mm2) and the torque as 2.7 N-m (24 in-lbs).
  face: >-
    estimated, AND NOT FROM THIS MODULE. The guide holds no flat picture of a PWR-1511-DC; its figures
    4-5 and 4-7 are isometric and carry no measure. The guard, handle, latch and lamp are the AC
    supply's, and the terminal block is a plain two-pole block following figure 4-7's -48V and RTN
    terminals, as arista/7280cr3-pwr-1000-dc draws its own.
  airflow: >-
    datasheet - the part number's RED and "FORWARD".
  handle-finish: >-
    A field, `handle-finish`, default `#a32a38`.
  power: >-
    No supply figure other than the rating is stated; nothing is written.
