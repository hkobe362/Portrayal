format: 1
kind: module
name: 7050x4-pwr-500-ac
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  The 500 W AC power supply of the Arista 7050X4-48Y-4DF, PWR-511-AC-RED (forward airflow, red handle).
  It is a 1RU module, 73.5 mm wide. A round fan guard with a red diagonal handle is at the left. An IEC
  C14 inlet, a latch and a status lamp are at the right. Two seat in the rear, 1+1 redundant and
  hot-swappable.
size: {w: 73.5, h: 40.0}
size-confidence: {w: datasheet, h: estimated}
part-numbers:
  PWR-511-AC-RED: {part: PWR-511-AC-RED}
attrs:
  power-output-w: 500
  input: ac
  inlet: c14
  airflow: front-to-back
  input-note: '100 - 240 VAC, 7.1 A, 50/60 Hz'
provenance:
  size: >-
    datasheet for the width, estimated for the height. The 7050X4 Series Data Sheet (03-0057-27,
    Aug 27th, 2025) describes the part as "PWR-511-AC-RED  Arista PSU, 1RU. AC/DC, 500W, FORWARD,
    73.5MM": 73.5 is its width. The 1RU height is 40 mm, as arista/7280cr3-pwr-1000-ac found for the
    same housing from a figure of the same series.
  part-number: >-
    datasheet - optional components and spares: "PWR-511-AC-RED  Arista PSU, 1RU. AC/DC, 500W,
    FORWARD, 73.5MM". The 7050X4 Quick Start Guide (DOC-06569-02) table 3 lists PWR-511-AC and table
    4 gives it as the supported supply of the 7050X4-48Y-4DF.
  power-output: >-
    datasheet - the "500W" of the ordering description and "Output Power 500W" in the power supply
    table. An output.
  input: >-
    datasheet - guide table 3: PWR-511-AC "100 - 240 VAC, 50/60 Hz 7.1A 50/60 Hz"; the datasheet's
    power supply table: 100-240 V AC, typical input current 6.3 - 2.3 A, 93 percent efficiency
    (Platinum), IEC 60320 C14. The two documents state the current differently; the guide's is
    written.
  airflow: >-
    datasheet - the part number's RED and "FORWARD". The reverse build is arista/7050x4-pwr-500-ac-rev.
  inlet: >-
    datasheet - "Input Connector IEC 60320 C14" for the PWR-511-AC.
  face: >-
    estimated, AND NOT FROM THIS MODULE. The 7050X4 guide draws the 1RU rear generically (figure D-1,
    with PWR-1011-class supplies in it, a 552 px raster), and no picture of a PWR-511 is held. The module
    is drawn as arista/7280cr3-pwr-1000-ac draws the same 73.5 mm 1RU housing; the datasheet gives
    the same 73.5MM width for it and nothing held shows a different outline.
  handle-finish: >-
    The red of the handle is a field, `handle-finish`, default `#a32a38`.
  power: >-
    No supply figure other than the rating is stated; nothing is written.
skins: [default]
states: [absent]
