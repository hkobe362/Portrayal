format: 1
kind: component
name: evolution-hcm-door-1u
version: 1.0.0
class: mechanical
behaviour: mounts
lid: true
description: >-
  The snap-on front door of the 1U Chatsworth Evolution horizontal cable manager, seen from
  the front - a contoured plate that closes the manager, with a longitudinal centre strip in
  a contrasting aluminium finish, whose returns snap onto the ends of the fingers; it swings
  open up or down and lifts off
fields:
  finish:
    label: Finish
    type: text
    default: '#1b1c1e'
provenance:
  size: >-
    estimated - the door closes the front between the ears: 450.0 wide, the 482.6 (19 in
    EIA) of the data sheet's ordering table less an estimated 16.3 of ear each end, and 44.45
    high, the 1U of that table at the EIA-310 1.75 in a unit. The pictures on page 3 show the
    door as one plate the full height of the manager; nothing dimensions its width.
  relief: >-
    estimated - the door stands at the front of the 208 mm overall depth: a plate 2.0 thick
    (204 to 206 above the back plate's face) and returns 16 mm deep along its top and bottom
    edges, 1.5 thick, that clip onto the finger heads. No document gives the door's section;
    the pictures show a thin contoured moulding.
  lid: >-
    datasheet - the Evolution Cable Management System data sheet (page 3) and the product
    page: "a contoured, snap-on front door [that] opens up or down", "swinging the cover up,
    down or easily remove it". The installation instructions (IIS-735441) say the same, "The
    cover will open up or down and can be removed when cabling", and in step 1 "Remove the
    horizontal cover from the horizontal chassis. The cover snaps onto the ends of the
    plastic, T-shaped cable guides (fingers)". It lifts off, so it is a lid (`lid: true`).
  strip: >-
    estimated - the data sheet's "longitudinal center feature in contrasting aluminum
    finish" is a strip along the door's middle. Its 6.0 height is read off the pictures
    against the 2U door; the aluminium shade is the render's. No picture shows the 1U door.
  finish: >-
    estimated - black, or Glacier White (colour letter 7 or E in the part number). The
    default is the black of the maker's renders; the Glacier White shade is a configuration's
    to give.
  mark: >-
    not drawn - the maker's renders show a small square badge near the door's left end.
    A vendor mark is never drawn, and nothing is reserved for it.
