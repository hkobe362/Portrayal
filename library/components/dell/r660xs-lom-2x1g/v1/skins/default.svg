<svg xmlns="http://www.w3.org/2000/svg" width="39.0mm" height="15.93mm" viewBox="0 0 39.0 15.93">
  <!-- r660xs-lom-2x1g: the card's bracket as the rear window shows it.
       Original art from positions read off Dell's R660xs rear render (ISM
       figure 7); the jacks are composed in the contract. The 1 and 2 are
       printed on the bracket under the jacks. -->
  <rect x="0.15" y="0.15" width="38.70" height="15.63" rx="0.4" fill="#cdd1d5" stroke="#9aa1a8" stroke-width="0.25"/>
  <g id="silkscreen">
    <text x="12.50" y="15.45" font-family="sans-serif" font-size="2.30" fill="#2b2f33" text-anchor="middle">1</text>
    <text x="30.40" y="15.45" font-family="sans-serif" font-size="2.30" fill="#2b2f33" text-anchor="middle">2</text>
  </g>
</svg>
