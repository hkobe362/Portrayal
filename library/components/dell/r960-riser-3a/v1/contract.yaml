format: 1
kind: module
name: r960-riser-3a
version: 1.0.0
class: riser
behaviour: fills
profile: server
description: >-
  Dell riser 3A (full length) of the PowerEdge R960 - two double-width full-height PCIe Gen5 x16
  slots for GPUs, 6 and 8; fitted in riser configuration 3. Drawn from the ISM's tables, not from
  a rear figure
attrs:
  riser: '3A (FL)'
  appears-in: 'riser configuration 3'
  power-absent: not-published
  slot-6: 'x16, full height, full length, double width, processor 4, PCIe Gen5'
  slot-8: 'x16, full height, full length, double width, processor 3, PCIe Gen5'
provenance:
  power: >-
    NOT PUBLISHED - the riser is a passive board with connectors; the ISM's table 83 routes the
    GPUs' power from the system board.
  identity: >-
    A REMOVABLE ASSEMBLY THAT BRINGS ITS OWN SLOTS (ISM figures 105 and 135), so it is a module
    with `bays`.
  slots: >-
    datasheet - R960 ISM table 88 (configuration 3: R3A slot 6 processor 4, slot 8 processor 3,
    both full height double width) and the technical guide's table 17 (slots 6 and 8 DW FL FH).
  face: >-
    ESTIMATED. No R960 document draws the rear of configuration 3. The cage is riser 3B's metal
    (dell/r960-riser-3b-cage@1) with its four windows read as two double-width ones; the cage's
    printed pairs (5-8) are not drawn because slots 5 and 7 do not exist on this riser.
  size: >-
    estimated - riser 3B's 104.3 x 84.0.
  depth: >-
    estimated - 258.0 as the half-length risers.
size: {w: 104.3, h: 84.0, d: 258.0}
size-confidence: {w: estimated, h: estimated, d: estimated}
body:
  depth: 258.0
  color: '#4a5057'
plan: {ref: dell/r960-riser-3-plan@1}
relief:
  features:
  - node: plate
    out: 20.0
    shape: true
    color: '#cfd3d7'
    confidence: estimated
    source: estimated by analogy with the R660's riser cages; no R960 model or side figure is held
bays:
  slot-6:
    slot: {connector: x16, lanes: 16, height: full, length: full, processor: 4, generation: 5}
    behind: true
    at: [3.5, 0.59]
    size: [90.0, 38.7]
    accepts: [dell/r960-pcie-filler-fh-2slot@1]
    default: dell/r960-pcie-filler-fh-2slot@1
  slot-8:
    slot: {connector: x16, lanes: 16, height: full, length: full, processor: 3, generation: 5}
    behind: true
    at: [3.5, 40.99]
    size: [90.0, 38.7]
    accepts: [dell/r960-pcie-filler-fh-2slot@1]
    default: dell/r960-pcie-filler-fh-2slot@1
elements:
  plate: {at: [0.3, 0.3], size: [103.7, 83.4], class: bezel}
skins: [default]
