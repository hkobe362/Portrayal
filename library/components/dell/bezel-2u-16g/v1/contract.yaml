format: 1
kind: module
name: bezel-2u-16g
version: 1.0.0
class: bezel
behaviour: mounts
profile: server
description: >-
  The optional security bezel for a 16th-generation 2U PowerEdge (R760) - a honeycomb of large hexagonal openings between two end plates, a keylock and a release button at the left end. Open in the hexagons, so the drives show through. Unbranded
attrs:
  power-absent: not-applicable
provenance:
  power: >-
    NOT APPLICABLE - a metal cover with no electronics; the LCD bezel, which has some, is not this part. The R760 ISM and technical guide give no figure for either.
  sources: >-
    R760 Installation and Service Manual (ISM) 'Removing the front bezel' and 'Installing the front bezel' (figures 37 and 38, an isometric view of the bezel with the LCD panel being taken off) and chassis dimensions table 10. NO STRAIGHT-ON VIEW OF THE R760'S BEZEL IS HELD: every front figure in the ISM (1 to 6) is drawn without it, and the isometric view carries no scale. The honeycomb's form, the end plates and the lock and release at the left (the ISM unlocks, presses the release and disengages the left end, then unhooks the right) are read from that figure; every dimension is an estimate.
  size: >-
    estimated - 433.35 x 82.4, the body between the ear folds (x 24.3..457.65) as the 1U R660 bezel is drawn (dell/bezel-1u-16g@1), 2.2 clear above and below on the 86.8 face as the R740xd's bezel clears it (dell/bezel-2u-14g@1: 82.35 tall on the same face). The figure shows the bezel ending at the ears.
  honeycomb: >-
    estimated - eight flat-topped hexagonal openings, 49.9 across and 43.2 tall, alternating high and low on a 41.6 pitch (a hexagonal tiling of 55.4 x 48.0 cells with 5 mm bars), centred on x 71.1 to 362.3, high ones at y 28.2 and low at 52.2. The figure's count is about six cells in the upper row, with two rows interlocked; the cell size follows from that count and the field width and is not a dimension anything states.
  end-plates: >-
    estimated - 24.8 wide each, as the R740xd's bezel's flanges; the left carries the keylock at (12.5, 16.0), about 9 across, and the release button, 4.6 x 22 at x 3.2, y 35; the right is plain. The ISM's wording gives the sides: lock and release at the left, hooks at the right.
  depth: >-
    datasheet - R760 ISM table 10: 35.84 mm ear to front with the bezel and 22.0 without, so the bezel stands 13.84 off the drives' face, the same figure the R660's table gives. It is drawn as one depth.
  no-branding: >-
    DELIBERATELY UNBRANDED. The ISM's figure shows a Dell wordmark across the middle; it is not drawn.
  lcd-variant: >-
    NOT MODELLED. The ISM says the removal and installation are the same with and without the LCD panel; the LCD bezel is a different part with a display and states.
  colour: >-
    photo - the bezel is dark grey in the ISM's figure; the value is this drawing's, not counted.
size: {w: 433.35, h: 82.4, d: 13.84}
size-confidence: {w: estimated, h: estimated, d: datasheet}
relief:
  features:
  - node: plate
    out: 13.84
    shape: true
    color: '#3a3e43'
    confidence: datasheet
    source: 35.84 ear-to-front with the bezel against 22 without, ISM table 10
elements:
  plate:
    at: [0.0, 0.0]
    size: [433.35, 82.4]
    class: bezel
    description: the bezel - end plates and honeycomb - over an open ground
  lock:
    at: [8.0, 11.5]
    size: [9.0, 9.0]
    class: control
    description: >-
      the keylock - unlocked with the bezel key before the bezel comes off (ISM 'Removing the front bezel', step 1).
  release:
    at: [3.2, 35.0]
    size: [4.6, 22.0]
    class: control
    description: >-
      the release button on the left end plate - step 2 of removal, pressed before the left end is pulled away. Its place is an estimate: the ISM's figure shows the button as a tab at the left end, unscaled.
skins: [default]
