format: 1
kind: module
name: qfx10008-pwr-ac2
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JNP10K-PWR-AC2 power supply as the QFX10008 guide sizes it, 3.6 x 3.5 in., for the QFX10008
  supply bays. It supplies 5 kW on one feed or 5.5 kW on two. Two C20 feeds (INP1/INP2) sit beside
  the exhaust field, with the FAULT, PWR OK and INP lamps, the red feed-setting DIP and the power
  rocker. The MX10004 and MX10008 seat the same part number as juniper/jnp10k-pwr-ac2, which is drawn
  to a different face.
attrs:
  model: JNP10K-PWR-AC2
  role: ac-power-supply
  power-output-w: 5500
provenance:
  sources: >-
    datasheet - QFX10008 Switch Hardware Guide (Juniper Networks, published 2025-12-11): the JNP10K-PWR-AC2
    Power Supply topic, Table 14, Table 15, Table 16 and Figure 10 (isometric) and Figure 27, the
    comparison with the QFX10000-PWR-AC.
  size: >-
    datasheet - Table 16 gives 3.5 in. high (8.89 cm), 3.6 in. wide (9.14 cm) and 15.1 in. deep (38.35
    cm), so 88.9 x 91.4 x 383.5 mm. The guide says the supply "fits into the standard power supply bay"
    and "protrudes from the bay when fully inserted", so the face is the bay's size and the extra
    length is behind the face. juniper/jnp10k-pwr-ac2@1 draws the same part number 84.0 x 97.0 mm from
    an MX10008 photograph, which is not this bay.
  power-output: >-
    datasheet - Table 15 and the topic text: 12.3 V DC, 5000 W with a single feed and 5500 W with a
    dual feed. The larger figure is carried, as juniper/jnp10k-pwr-ac2@1 does.
  face: >-
    estimated - no flat figure of this supply is held (Figure 10 and Figure 27 are isometric). The
    arrangement is that of juniper/jnp10k-pwr-ac2@1 (two inlets in one column beside the exhaust field,
    a lamp row, the DIP, the handle and the rocker), refitted by hand to the 91.4 x 88.9 mm face so
    that nothing overlaps. Positions are estimated, not measured.
  colour: >-
    borrowed - the dark grey finish of juniper/jnp10k-pwr-ac2@1; the guide's line drawings carry no
    colour.
  positions: >-
    FIELDS, since 1.1.0 of juniper/jnp10k-pwr-ac2 (docs/switch-positions-design.md, #808): `state`, each
    `off` or `on`. The rocker is a see-saw with I at the left and O at the right; OFF raises the I end
    and ON the O end. The heights are those of juniper/jnp10k-pwr-ac2@1 and are estimated. The skin
    draws OFF; nothing held says how a unit ships.
states:
- ok
- fault
- absent
parts:
- {ref: std/c20-inlet@1, id: inp2, at: [46.0, 4.0], attrs: {function: feed INP2}}
- {ref: std/c20-inlet@1, id: inp1, at: [46.0, 50.0], attrs: {function: feed INP1}}
size:
  w: 91.4
  h: 88.9
  d: 383.5
size-confidence: {w: datasheet, h: datasheet, d: datasheet}
fields:
  state: {label: State, type: choice, options: ['off', 'on'], default: 'off'}
relief:
  features:
  - {node: rocker-off, out: 2.5, profile: [[0, 2.5], [13.0, 1.1]], confidence: estimated, source: 'the tilt of a see-saw rocker: the raised end at the part''s own estimated rocker height, the low end at 0.45 of it, the ratio the GL-12xB GLB rocker shows (common/rocker-switch@1); no source gives this part''s; the rocker''s 2.5 is assumed'}
  - {node: rocker-on, out: 2.5, profile: [[0, 1.1], [13.0, 2.5]], confidence: estimated, source: 'the tilt of a see-saw rocker: the raised end at the part''s own estimated rocker height, the low end at 0.45 of it, the ratio the GL-12xB GLB rocker shows (common/rocker-switch@1); no source gives this part''s; the rocker''s 2.5 is assumed'}
skins: [default]
