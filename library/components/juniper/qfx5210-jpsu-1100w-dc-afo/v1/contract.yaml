format: 1
kind: module
name: qfx5210-jpsu-1100w-dc-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  JPSU-1100W-DC-AFO, a 1100 W DC power supply with dual feeds and port-to-FRU (front-to-back) airflow (AIR
  OUT). It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin.
  The QFX5210 hardware guide says the QFX5210-64C with DC supplies takes two, in slots 0 and 1 at the two
  ends of the FRU panel. The face carries a three-terminal block (terminals 1 to 3). The V+ terminals are
  shunted internally, as are the V-. It also has a tall gold handle, one round bi-colour lamp and a black
  ejector lever. The back-to-front sibling is JPSU-1100W-DC-AFI. AC and DC supplies, and supplies of different
  airflow direction, are never mixed in one chassis.
attrs:
  model: JPSU-1100W-DC-AFO
  role: dc-power-supply
  inlet: dc-terminal
  power-output-w: 1100
  airflow: front-to-back
  input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 25 A maximum (guide Table 21)
provenance:
  size: >-
    estimated - the same bay as the AC supply (52.0 x 41.8 mm), read off the FRU-side photograph and Figure
    8: the DC supply fills the same slot. No document gives a size.
  depth: >-
    not stated. Guide Figures 16 and 18 are isometric drawings with no scale.
  face: >-
    drawing - guide Figure 19 (a straight-on figure of the DC faceplate, aspect 1.26 against the bay's
    1.24, so its fractions are taken against the bay's size): a dark terminal block at the left holding three
    numbered terminals in a column, the tall handle, a field of square vents in two columns, the round lamp
    below them and the ejector lever at the lower right. The FRU-side Figure 8 shows the same three-terminal
    block in the supplies at both ends. No photograph of a DC build was held. Positions are read at 11.5
    px/mm and are estimated.
  power-output-w: >-
    datasheet - the guide's text says "the DC power supply in QFX5210 is 1100 W with dual feeds". An OUTPUT,
    since a supply provides power.
  leds: >-
    datasheet - guide Table 23: one lamp; blue blinking in standby, blue steady when the supply is sending
    out power correctly, red steady on an error, alternating red and blue on a warning, red blinking when
    only one supply has DC power. Table 22 describes the AC supply's lamp in green and red; this DC
    supply's own table is used.
  airflow: >-
    datasheet - guide Table 3: JPSU-1100W-DC-AFO is ports-to-FRUs (front-to-back) airflow, CLI "DC AFO
    11000W PSU", a misprint of 1100. The guide gives no handle colour for the DC supply in Table 17 (which
    lists the AC ones); the colour of the airflow direction is used.
  colour: >-
    borrowed - the guide's handle colour for the AC sibling (Juniper Gold, orange in the photograph); the
    guide says the supplies are colour-coded by airflow, all gold for AIR OUT, so the DC one carries it.
states:
- ok
- fault
- absent
