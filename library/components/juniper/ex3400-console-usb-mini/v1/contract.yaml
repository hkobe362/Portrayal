format: 1
kind: component
name: ex3400-console-usb-mini
version: 1.0.0
class: port
profile: networking
description: >-
  Mini-USB Type-B console receptacle on the front panel of the Juniper EX3400, labelled CON. It
  takes a Mini-B (5-pin) plug. The sloped lower corners of the opening show which way up the plug goes.
size: {w: 7.6, h: 3.0}
attrs: {media: usb-mini-b}
provenance:
  size: >-
    photo-measured - Juniper image-library EX3400-48P front studio photograph (ex3400-48p-front-high),
    body width 441.0 mm over 1467 px (3.327 px/mm): the receptacle shell reads 24 px by 9 px, 7.2 by
    2.8 mm, and is rounded up to 7.6 by 3.0 for the shell edge. The guide names the port ("Mini-USB
    Type-B console port accepts a Mini-B plug (5-pin) connector") and gives no dimension. The
    library registry holds no Mini-USB entry, so this part claims no standard. No depth is
    stated anywhere in the guide, so none is carried.
elements:
  opening: {at: [0.45, 0.4], size: [6.7, 2.15], class: cutout}
size-confidence: {w: photo-measured, h: photo-measured}
skins: [default]
