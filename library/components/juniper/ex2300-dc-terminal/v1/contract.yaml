format: 1
kind: component
name: ex2300-dc-terminal
version: 1.0.0
class: inlet
profile: networking
description: >-
  Four-pole DC screw terminal block on the rear panel of the Juniper EX2300-24T-DC. The guide names the
  poles INPUT 1+, INPUT 1-, INPUT 2+ and INPUT 2-. It has four terminal screws between two round
  mounting screws, in a dark strip on a flat plate. The guide covers it with a clear plastic cover that
  the studio photograph does not show. The supply is built into the chassis, so this is the chassis's own
  power entry and not a module.
size: {w: 52.6, h: 17.5}
size-confidence: {w: estimated, h: estimated}
attrs: {media: dc-terminal}
provenance:
  existence: >-
    datasheet - EX2300 Switch Hardware Guide (published 2025-08-12), Figure 13 callout 9 "DC power
    terminals", and the DC connection procedure, which names four terminals INPUT 1+, INPUT 1-,
    INPUT 2+ and INPUT 2- under a clear plastic cover.
  size: >-
    estimated - read off Juniper's straight-on studio photograph of the EX2300-24T-DC rear
    (file named ex2300-24p-rear-high.jpg, which shows the DC unit) at 3.29 px per mm across from
    the stated 441.9 mm width: the plate spans 52.6 x 17.5 mm, the four terminal windows are 6.8 x
    8.9 mm on an 8.2 mm pitch and the end screws sit 5.9 and 47.7 mm from the left edge. Good to
    about half a millimetre.
  poles: >-
    photo-measured - the order of the four terminal windows from the left of the photograph. Which
    window is INPUT 1+ or INPUT 2- is printed under the block in the guide's figure and not in the
    photograph, so the poles are numbered by position only.
