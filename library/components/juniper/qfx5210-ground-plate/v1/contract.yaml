format: 1
kind: component
name: qfx5210-ground-plate
version: 1.0.0
class: ground
behaviour: mounts
profile: networking
description: >-
  Protective earthing terminal on the FRU panel of the QFX5210-64C. It is a pale bracket plate with two
  screws, beside the panel's earth symbol, that one two-hole lug lands across. The guide says the chassis
  has a two-hole protective grounding terminal and that the posts of the bracket point to the left. The lug
  is fixed with two #10-32 UNF screws and washers (not supplied). For an AC-powered switch the terminal is
  used as well as the earth pin of the power cord.
attrs:
  model: QFX5210 protective earthing terminal
provenance:
  size: >-
    estimated - the plate outline is read off the FRU-side studio photograph (qfx5210-64c-rear-high,
    4.1 px/mm across the body): about 43 x 11 mm there, and 33 x 12 mm on the guide's Figure 8.
    The smaller extent is drawn. Neither was measured against anything of known size.
  holes: >-
    estimated - the guide gives no spacing for the two holes. The drawn screws are 16.0 mm apart on
    the guide's Figure 8 (3.25 px/mm) and 18 mm on the photograph, so 15.9 mm, the 5/8 in. of a
    two-hole lug, is drawn. The size of the screws the lug takes (#10-32 UNF) is the guide's.
  seat: >-
    NOT A LUG SEAT. The plate draws the terminal and presents no connection point: the library's lug seats
    belong to parts whose screw sizes and pair pitch a document states, and this guide states a screw size
    and no spacing, so no pair seat is claimed.
size:
  w: 34.0
  h: 12.0
size-confidence: {w: estimated, h: estimated}
size-notes: the plate outline read off the FRU-side photograph and the guide's Figure 8; no document gives it
