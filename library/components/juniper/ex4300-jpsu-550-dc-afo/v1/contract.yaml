format: 1
kind: module
name: ex4300-jpsu-550-dc-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  Juniper JPSU-550-DC-AFO-A, the 550 W DC power supply of the EX4300 switches, labelled AIR OUT
  (AFO): front-to-back airflow. It ships in the EX4300-48T-DC and seats in the PSU 0 and PSU 1
  slots of the DC-capable models. Hot-insertable and hot-removable; IN OK and OUT OK lamps, a
  honeycomb vent, a loop handle and a five-terminal screw block printed + - earth - + with a cord
  retainer. It does not supply Power over Ethernet.
attrs:
  model: JPSU-550-DC-AFO-A
  part-number: JPSU-550-DC-AFO-A
  role: dc-power-supply
  power-output-w: 550
  input-voltage: -40.8 through -60 VDC (-43.5 +/- 0.5 VDC minimum to power on)
  input-current: 14.2 A
  inlet: dc-terminal
  airflow: front-to-back
  airflow-label: AIR OUT (AFO)
  weight-kg: 1.1
provenance:
  part-number: >-
    datasheet - EX4300 Switch Hardware Guide (published 2025-08-12), Table 47 "Details of the DC
    Power Supplies in EX4300 Switches": JPSU-550-DC-AFO-A and JPSU-550-DC-AFI-A; Table 48 gives the
    airflow of each. The datasheet's ordering table writes them JPSU-550-DC-AFO and JPSU-550-DC-AFI,
    without the -A suffix. The EX4300-48T-DC ships with the AFO supply (Table 3, Table 28)
  power-output-w: >-
    datasheet - guide, DC Power Supply in EX4300 Switches, Table 47 and the model name: a 550 W DC
    supply; DC input current rating 14.2 A; operating range -40.8 through -60 VDC, with a minimum of
    -43.5 +/- 0.5 VDC to power on. The guide's DC power budget note says the DC supply does not
    support PoE
  weight: >-
    datasheet - guide Table 47: 2.43 lb (1.1 kg)
  size: >-
    estimated - the guide's rear-panel figure (Figure 13, g022074) shows AC supplies and no DC supply,
    so the DC supply takes the AC supply's aperture, 84.0 x 42.0 mm: the slot is the same. The
    flat faceplate drawing (Figure 45, g022081) gives the face's proportions, which match that
    aperture; no dimension of its own is given
  face: >-
    drawing - measured from the guide's flat DC faceplate drawing (Figure 45, g022081, p.121), with
    the plate's width scaled to 84.0 mm and its height to 42.0 mm: the loop handle at the left, the
    AIR OUT (AFO) label box with its fan glyph and the IN OK and OUT OK lamps along the top, the
    cord retainer at the right, and a block of five screw terminals at 8.4 mm pitch printed
    + - earth - + (the centre one the earth symbol), as the guide's text says: five terminals.
    Positions are good to about 0.5 mm, the resolution of the figure
  leds: >-
    datasheet - guide Figure 45 and Table 52: IN OK green when the supply is receiving power, unlit
    when it is disconnected or the input is out of range; OUT OK green when the supply is
    functioning correctly, unlit when IN OK is unlit or it is not delivering, red when the supply
    has failed
  power-draw: >-
    NOT APPLICABLE - a supply states its output
states:
- ok
- fault
- absent
elements:
  led-in-ok:
    at: [56.1, 6.3]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - 'off'
  led-out-ok:
    at: [67.9, 6.3]
    size: [2.2, 2.2]
    class: led
    states:
    - {name: green, color: '#39b54a'}
    - {name: red, color: '#ef4444'}
    - 'off'
  latch:
    at: [12.6, 2.0]
    size: [6.5, 38.0]
    class: latch
  terminal-block:
    at: [26.1, 19.6]
    size: [44.0, 17.2]
    class: terminal
size:
  w: 84.0
  h: 42.0
size-confidence: {w: estimated, h: estimated}
relief:
  features:
  - node: latch
    out: 2.0
    color: '#2b2e35'
    confidence: estimated
    source: guide Figure 44 - the loop handle stands proud of the face; projection not measured
