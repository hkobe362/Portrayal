format: 1
kind: module
name: qfx5200-48y-dpsu-ai
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  QFX520048Y-DPSU-AI, the 650 W DC power supply of the QFX5200-48Y, with back-to-front (FRU-to-port)
  airflow. It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin. The
  QFX5200 hardware guide says the QFX5200-48Y takes it, two to a switch, in the slots at the two ends of the FRU
  panel, and that AC and DC supplies of the same airflow may be mixed in the 48Y. The face is that of the
  front-to-back DC supply with a blue latch: one bi-coloured lamp, a silver frame with square vents, a black bail
  handle and a three-pin DC power connector (pin 3 return, pin 2 -36 to -72 V, pin 1 grounding). The front-to-back
  sibling is QFX520048Y-DPSU-AO.
attrs:
  model: QFX520048Y-DPSU-AI
  role: dc-power-supply
  inlet: dc-terminal
  power-output-w: 650
  airflow: back-to-front
  input: rated -48 to -60 VDC at 21 A; -36 to -72 VDC at 25 A to 11 A (QFX5200-48Y, guide Table 25)
provenance:
  size: >-
    photo-measured, for the AC sibling - the same frame and latch as qfx5200-48y-dpsu-ao@1 (54.4 x 39.7 mm). No
    photograph of this back-to-front DC supply exists, so nothing here is measured on it.
  depth: >-
    not stated. The guide's figure 40 is an isometric drawing with no scale and its tables give no depth.
  face: >-
    drawing - that of qfx5200-48y-dpsu-ao@1 (the guide's flat figures 42 and 44). The guide draws one DC supply and says the
    AI supply differs by airflow and colour.
  power-output-w: >-
    datasheet - the guide's table of hardware components gives the CLI name DC AFI 650W PSU for the 48Y; there is no separate
    output rating. An OUTPUT, since a supply provides power.
  leds: >-
    datasheet - guide Table 27 (DC Power Supply LED on a QFX5200-48Y): one bi-coloured lamp. Off: disconnected or no power in;
    green blinking: standby; green steady: output good; red and green alternating: a warning; red steady: an error; red
    blinking: the supply's internal fan has failed.
  airflow: >-
    datasheet - guide Table 3: QFX520048Y-DPSU-AI is FRUs-to-ports airflow (back-to-front). The guide's Table 19 gives the AC
    supply's panel as blue for airflow in; the DC supply's colour is carried from it by the same direction.
  colour: >-
    borrowed - the blue the library already carries for Juniper Azure Blue on juniper/jpsu-650w-ac-ai@1; estimated.
states:
- ok
- fault
- absent
