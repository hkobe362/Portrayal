format: 1
kind: module
name: jnp10k-pwr-blnk
version: 1.0.0
class: blank
behaviour: fills
profile: networking
description: >-
  Power supply slot cover for the MX10000 series. The MX10004, MX10008 and
  MX10016 ship one in each supply slot they leave unfilled. A plain panel the width
  of a supply, with a pull at the top.
attrs:
  model: JNP10K-PWR-BLNK
provenance:
  states: >-
    NO LAMP AND NO HEALTH ON A FILLER PANEL. A slot cover is a piece of sheet metal
    that fills an opening: it has no indicator to light and no condition to report,
    so this part draws no elements at all. `absent` stays, because an empty slot is a
    real thing to draw.
  size: >-
    derived - fills the 84.0 mm wide power supply aperture the JNP10K-PWR-AC2
    occupies. The three chassis open slightly different apertures in this library
    (84.0 x 97.0 mm on the MX10004, 84.0 x 93.5 mm on the MX10008, 84.0 x 91.0 mm
    on the MX10016), each read from a photograph or drawing and none measured; the
    cover takes the smallest, which fits all three, rather than overhang a bay. The
    difference is the library's own and is recorded against the supply too. No
    vendor drawing of the cover is in the corpus.
  part-number: >-
    vendor - JNP10K-PWR-BLNK, named as the "power supply blank cover panel" in the
    MX10004 hardware guide's configuration table (MX10004-BASE and
    MX10004-3F-BASE, two supplies plus one cover). The MX10008 and MX10016
    guides' tables ship power supply covers - three on the MX10008 base, five on
    the MX10016 base - without a part number; the supply slots are the same
    JNP10K-PWR family across the three chassis, so the one part number is
    carried to them as an inference, not a vendor statement.
  face: >-
    estimated - no photograph or drawing of this cover is in the intake. The art
    follows the MX10000 line-card cover already in the library: a plain light
    panel with a pull, turned to the supply's upright shape. The OUTLINE is
    sourced and the DETAIL is not, which is the honest split.
states: [absent]
size:
  w: 84.0
  h: 91.0
size-confidence: {w: estimated, h: estimated}
size-notes: >-
  A slot opening, not the part: no vendor drawing of the cover is held. The width is the
  supply aperture on all three chassis; the height is the shortest of the three apertures
  the library draws, so the cover never overhangs a bay.
