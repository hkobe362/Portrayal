format: 1
kind: module
name: qfx5200-jpsu-850w-dc-afo
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  JPSU-850W-DC-AFO, a DC power supply with front-to-back (port-to-FRU) airflow (AIR OUT). It is a
  field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin. The QFX5200
  hardware guide says the QFX5200-32C takes it (the -32C-L takes AC supplies only), two to a switch, in the
  slots at the right of the FRU panel. The face carries four terminal studs in a row labelled V-, V-, V+
  and V+ (the two V+ are shunted internally, as are the two V-), a protective earthing screw beside them, three
  lamps labelled IN, OUT and !, a Juniper Gold latch and an ejector lever. The back-to-front sibling is
  JPSU-850W-DC-AFI. AC and DC supplies are never mixed in one 32C chassis, and supplies of different airflow
  direction are never mixed in any.
attrs:
  model: JPSU-850W-DC-AFO
  role: dc-power-supply
  inlet: dc-terminal
  power-output-w: 850
  airflow: front-to-back
  input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 10 A maximum (QFX5200-32C, guide Table 25)
provenance:
  size: >-
    estimated - the guide gives this supply no size. It seats in the bay of the AC supply, so the bay's size
    (54.8 x 40.2 mm, itself estimated) is used: the module is drawn to fill it.
  depth: >-
    not stated. The guide's figure 39 is an isometric drawing with no scale and its tables give no depth.
  face: >-
    drawing - the guide's figure 41 (a schematic closeup whose aspect is 12 percent off the bay's, so only fractions
    along each axis are taken, against the bay's 54.8 x 40.2 mm): a tall latch at the left, a block of four studs
    across the top with V-, V-, V+ and V+ above them, a protective earthing screw at the right of the block, three
    lamps IN, OUT and ! beneath, a field of square vents at the lower left, an earthing symbol at the lower right and
    an ejector lever at the right. Figure 43 shows the same face with the lamps numbered 1 to 3. The arrangement is that
    of juniper/mx204-psu-dc@1, which the guide's figure resembles. All positions are approximate and ESTIMATED.
  power-output-w: >-
    the part number says 850 W. THE GUIDE'S TEXT SAYS "The DC power supply in QFX5200-32C is 1100 W with dual feeds" and
    its input rating (10 A at -48 V) is about 480 W, so the sources disagree. The part number is used, as for the AC
    sibling; it is an OUTPUT, since a supply provides power. See the gap on the device.
  leds: >-
    datasheet - guide Table 26 (DC power supply LEDs on a QFX5200-32C): Input green when power is coming in, unlit when
    disconnected; Output green when the supply sends out power correctly, unlit otherwise; Fault amber when an error has
    been detected (replace it and leave it seated for airflow). The face prints them IN, OUT and !.
  airflow: >-
    datasheet - guide Table 3: JPSU-850W-DC-AFO is ports-to-FRUs airflow (front-to-back), CLI "DC AFO 850W PSU". The guide
    gives no handle colour for the DC supply; the Gold latch is carried from the AC supply by the same name (Table 19).
  colour: >-
    borrowed - the colour of the AC sibling's handle, itself the orange the QFX5120-48Y rear photograph shows on parts
    the guide calls Juniper Gold; estimated.
states:
