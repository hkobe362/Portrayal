format: 1
kind: module
name: qfx524x-2ru-pwr-do
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  QFX524X-2RU-PWR-DO, the 3000 W DC power supply of the DC builds of the QFX5241-64OD and QFX5241-64QD
  (QFX5241-64OD-DO and QFX5241-64QD-DO), with front-to-back airflow (AIR OUT, port-to-FRU, also written AFO). It
  is a field-replaceable unit, hot-removable and hot-insertable, in a 1+1 pair; the switch ships with two, stacked
  at the left of the rear. It takes -48 to -60 VDC through a six-pin, two-by-three DC connector, and the guide ships
  two six-wire DC power cords with the switch. The face carries a grille with a pull handle at its left, the
  six-pin connector, a release latch and one bicolour lamp. The AC builds take the QFX5240-PWR-AC-AO, which is a
  different part number.
attrs:
  model: QFX524X-2RU-PWR-DO
  role: dc-power-supply
  power-output-w: 3000
  airflow: front-to-back
  inlet: other
  input: -48 to -60 VDC, 80 A maximum per supply for 3 kW output; output 12.2 V (guide Tables 6 and 17)
provenance:
  size: >-
    estimated - the supply stands in the same bay as the AC supply and the guide's figure 22 (DC FRU panel, flat)
    draws it the same width and height: 310 px by 168 px against the figure's chassis body 1814 px wide for 438.4
    mm (4.14 px/mm), which is 74.9 mm by 40.6 mm, within a pixel of the AC supply's measured 73.7 by 39.5 mm
    (photo-measured on the QFX5241-64OD AC photograph). The AC photograph's size is carried. No photograph of a DC
    build is held.
  depth: >-
    not stated. Searched the QFX5241-64OD and QFX5241-64QD hardware guide (figure 25, the DC power supply
    description, Table 17 and the physical specifications) for the supply's depth or weight. No depth is written.
  face: >-
    drawing - the guide's figure 22 (DC FRU panel), a flat drawing, read at 6 times zoom: a vertical slot pull
    handle at the left, a field of hexagonal holes, a block of six round pins in two rows of three, a latch at the
    right and a round lamp at the foot of the latch. Positions are scaled off the figure at 4.14 px/mm and estimated
    to about 0.5 mm. The drawing carries no colour, so the faces are drawn in the greys of the AC supply; no
    photograph of a DC build is held.
  power-output-w: >-
    datasheet - guide Tables 6, 8 and 17 (QFX524X-2RU-PWR-DO, 3000 W maximum output power at -48 V to -60 V). An
    OUTPUT, since a supply provides power.
  leds: >-
    datasheet - guide, DC Power Supply Unit LED (figure 26, Table 19): the single bicolour lamp (green and amber)
    on the faceplate shows the supply's state. Its position is the circle at the foot of the latch in figure 22.
  airflow: >-
    datasheet - guide Tables 4, 6 and 8: QFX524X-2RU-PWR-DO is airflow out, ports-to-FRUs, front-to-back.
  input: >-
    datasheet - guide Tables 6 and 17: -48 V to -60 V, 80 A maximum per supply; the connector is the six-pin two by
    three one of "DC Power Cord Specifications" (pins P1, P2 and S1 negative, S2, P3 and P4 positive).
