format: 1
kind: module
name: qfx5210-jpsu-1100w-dc-afi
version: 1.0.0
class: psu
behaviour: fills
profile: networking
description: >-
  JPSU-1100W-DC-AFI, a 1100 W DC power supply with dual feeds and FRU-to-port (back-to-front) airflow (AIR
  IN). It is a field-replaceable unit, hot-removable and hot-insertable, and load-shares with its twin. The
  QFX5210 hardware guide says the QFX5210-64C with DC supplies takes two, in slots 0 and 1 at the two ends
  of the FRU panel. The face is that of the front-to-back DC supply with an azure blue handle. It has a
  three-terminal block (the V+ terminals are shunted internally, as are the V-), one round bi-colour
  lamp and a black ejector lever. The front-to-back sibling is JPSU-1100W-DC-AFO. AC and DC supplies, and
  supplies of different airflow direction, are never mixed in one chassis.
attrs:
  model: JPSU-1100W-DC-AFI
  role: dc-power-supply
  inlet: dc-terminal
  power-output-w: 1100
  airflow: back-to-front
  input: rated -48 to -60 VDC, operating range -40 to -72 VDC, 25 A maximum (guide Table 21)
provenance:
  size: >-
    estimated - the same bay as the AC supply (52.0 x 41.8 mm), read off the FRU-side photograph and Figure
    8. No document gives a size.
  depth: >-
    not stated. Guide Figures 16 and 18 are isometric drawings with no scale.
  face: >-
    borrowed - juniper/qfx5210-jpsu-1100w-dc-afo@1, whose positions were read from the guide's Figure 19.
    The guide's figures do not tell the two directions apart except by handle colour and label, and no
    photograph of a DC build was held.
  power-output-w: >-
    datasheet - the guide's text says "the DC power supply in QFX5210 is 1100 W with dual feeds". An OUTPUT,
    since a supply provides power.
  leds: >-
    datasheet - guide Table 23: blue blinking in standby, blue steady when the supply is sending out power
    correctly, red steady on an error, alternating red and blue on a warning.
  airflow: >-
    datasheet - guide Table 3: JPSU-1100W-DC-AFI is FRUs-to-ports (back-to-front) airflow, CLI "DC AFI
    11000W PSU", a misprint of 1100.
  colour: >-
    estimated - the guide says the supplies are colour-coded by airflow, all azure blue for AIR IN; no
    photograph of this build was held, so a plain azure is drawn, not a paint reference.
states:
- ok
- fault
- absent
