format: 1
kind: module
name: ex4500-vc1
version: 1.0.0
class: fabric
behaviour: fills
profile: networking
description: >-
  The Virtual Chassis module of the Juniper EX4500 switches, printed EX4500-40F-VC1-128G. It sits in the
  same rear strip as the intraconnect module and replaces it. It has two dedicated Virtual Chassis ports,
  VCP-0 and VCP-1, that join the switch to an EX4200 or EX4500 switch. It is an offline field-replaceable
  unit. Two lamps, ST and VC MODE, show its state. Three of the eight models ship with it. The guide
  gives no Juniper part number for it.
attrs:
  role: virtual-chassis-module
  power-absent: not-published
provenance:
  sources: >-
    datasheet - EX4500 Switch Hardware Guide (modified 2017-10-18): Virtual Chassis Module in EX4500
    Switches (Figures 12 and 13, Table 9) and Figure 7, the rear panel with the module, both isometric
    drawings. The guide's own copyright and the Juniper EULA govern it; it is read for facts only and
    nothing of it is copied. The model name is printed on the module, and the guide prints no part number.
  size: >-
    estimated - Figures 12 and 7 are isometric with no scale. The module takes the intraconnect module's
    strip, 345.9 x 21.7 mm, since it fills the same rear slot (juniper/ex4500-lb@1).
  face: >-
    estimated - read as fractions of the isometric Figure 12: a screw at each end, two lamps at the left,
    two connector openings in the left half and the model name at the lower right. Every position is
    estimated, and the two connectors are drawn as plain openings because the guide names no connector
    type for the dedicated ports. The maker's mark is a logo and is not drawn.
  led: >-
    datasheet - Table 9: ST is green when the module works. VC MODE is green when the module and its ports
    are active, and unlit when the module works as an intraconnect module and the ports are not active.
  depth: >-
    estimated - not stated. No depth is written.
  power: >-
    estimated - not published. The module declares power-absent so that the missing figure is a statement.
states: [absent]
