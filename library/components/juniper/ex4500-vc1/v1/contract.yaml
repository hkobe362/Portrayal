    class: port
  screw-left:
    at: [2.8, 10.3]
    size: [8.0, 8.0]
    class: screw
  screw-right:
    at: [333.1, 10.3]
    size: [8.0, 8.0]
    class: screw
size:
  w: 345.9
  h: 21.7
