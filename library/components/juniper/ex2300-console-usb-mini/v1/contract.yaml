format: 1
kind: component
name: ex2300-console-usb-mini
version: 1.0.0
class: port
profile: networking
description: >-
  Mini-USB console port on the front panel of the Juniper EX2300 24-port and 48-port switches,
  printed CON. A mini-B receptacle in a plain shell at the lower right of the front, under the
  Factory Reset/Mode button. The guide calls it the Mini-USB Type-B console port. It carries a
  serial console over USB, so it is a management port and not a data port.
size: {w: 7.9, h: 4.6}
size-confidence: {w: estimated, h: estimated}
attrs: {media: mini-usb-b, role: console}
provenance:
  existence: >-
    datasheet - EX2300 Switch Hardware Guide (published 2025-08-12), Figures 3 and 4, callout 5:
    "Mini-USB console port", and the console port section of the specifications ("Mini-USB
    Type-B Console Port Pinout Specifications"). EX2300 24-port and 48-port models carry it on
    the front panel and an RJ-45 console port on the rear panel.
  size: >-
    estimated - read off Juniper's straight-on studio photographs of the EX2300-24P and
    EX2300-48P fronts: the shell spans about 25 px across and 14 px down at 3.27 px per mm, 7.7 by
    4.4 mm on the 24P and 7.3 by 4.4 on the 48P, so 7.9 x 4.6 is carried, good to about half a
    millimetre. The registry has no mini-USB entry (it holds micro-USB Type-B and the other USB
    receptacles), so this part states no standard and no mating interface.
  face: >-
    photo-measured - the photograph shows a dark trapezoid opening inside a light shell with a pin
    row. Drawn as the shell, a chamfered opening and a pin bar.
elements:
  opening: {at: [0.7, 0.7], size: [6.5, 3.2], class: port}
relief:
  wall: '#8d949c'
connection-points:
  mate: {at: [3.95, 2.3], direction: front}
skins: [default]
