provenance:
  ru:
    confidence: datasheet
    note: >-
      "Number of rack unit 44U" in the product data sheet; "Rack mounting height
      44 U" in the user guide, which defines one U as 44.4 mm (1.75 in).
  form:
    confidence: datasheet
    note: >-
      The data sheet names it a 4 Post rack, and the user guide a Four-Post
      Rack: two left and two right vertical frame posts joined by side frame
      brackets and horizontal frame brackets. Open frame, no doors or panels.
  width:
    confidence: datasheet
    note: >-
      "Rack Width 19 in" in the data sheet; the user guide gives the rack mounting
      width as 482 mm (19 in) and the external width as 600 mm.
  holes:
    confidence: datasheet
    note: >-
      The user guide table gives the mounting holes of the AR203A as "Square 9.5
      mm", and ships 60 M6 x 16 screws with 60 cage nuts for them. The AR204A in
      the same guide has tapped #12-24 holes. Every third hole on a flange is
      numbered and marks the middle of a U.
  rails:
    confidence: datasheet
    note: >-
      The data sheet gives the minimum and the maximum mounting depth as one
      figure, 29.1 in (739.9 mm), so the rear rail is fixed. The user guide
      lists the four side frame brackets as 740 mm, the figure written here.
      The 739.9 mm is that length in inches, rounded and converted back.
  max-device-depth:
    confidence: datasheet
    note: >-
      "Maximum Mounting Depth 29.1 in (739.9 mm)" in the data sheet, with the
      same rounding as the rail depth; 740 mm is the length of the side frame
      brackets in the user guide.
  outer:
    confidence: datasheet
    note: >-
      Height 83.9 in (2130 mm), width 23.6 in (600 mm), depth 29.4 in (747 mm)
      in the data sheet; the user guide gives 2130.40, 600 and 747 mm.
  weight-kg:
    confidence: datasheet
    note: >-
      Net weight 40.32 kg (88.90 lb) in the user guide. The data sheet says
      89.09 lb (40.41 kg); the gap below records both.
  load:
    confidence: datasheet
    note: >-
      "Permanent permissible load 2000 lb (907.2 kg) static" in the data sheet;
      the user guide gives a weight capacity of 907.18 kg. No rolling rating is
      stated, because the rack has no casters.
  numbering:
    confidence: estimated
    note: >-
      A stand-in. Both documents say the U-spacing is numbered (every third
      hole), and neither says whether the labels run up or down. Bottom-up from
      1 is the default of the rack file.
  hole-centres:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 figure, 465.1 mm between hole lines (18.312
      in). The sheets state the rack as EIA-310E and print no hole spacing.
  opening:
    confidence: estimated
    note: >-
      A stand-in for the EIA-310 minimum clear opening between the rails, 450.85
      mm (17.75 in). The sheets print no figure for it.
gaps:
  - what: numbering
    reason: vendor-silent
    note: >-
      The data sheet and the user guide both say the U-space is numbered and
      show the labels only in figures.
    wanted: The direction the labels run on the flange, from a photograph of the rail or a dimensioned drawing.
  - what: hole-centres
    reason: vendor-silent
    note: Neither document prints the horizontal spacing of the hole lines.
    wanted: A dimensioned front view of the vertical mounting flanges.
  - what: opening
    reason: vendor-silent
    note: Neither document prints the clear opening between the rails.
    wanted: A dimensioned front view, or a measurement between the flanges.
  - what: weight-kg
    reason: sources-disagree
    note: >-
      The user guide gives a net weight of 40.32 kg (88.90 lb); the data sheet
      gives 89.09 lb (40.41 kg). The user guide is written here.
    wanted: Which of the two is the current product, from the maker.
