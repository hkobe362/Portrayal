description: >-
  The APC NetShelter four-post open frame rack, 44U, with 9.5 mm square holes
  for M6 cage nuts. Rail depth is fixed by its side frame brackets. Rated for a
  static load only. The AR204A is the same frame with tapped #12-24 holes.
