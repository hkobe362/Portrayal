format: 1
kind: rack
name: 4-post-cabinet
version: 1.0.0
maturity: modelled
manufacturer: Generic
model: 4-post-cabinet
description: >-
  The rail geometry of a generic enclosed four-post cabinet, with the rail depth
  set in steps where a cabinet is built. Doors, panels and zero-U channels are a
  maker's and are not stated here.
form: 4-post-cabinet
ru: 42
numbering:
  direction: bottom-up
  start: 1
width: 19
holes:
  style: square
hole-centres: 465
opening: 450
rails:
  - id: front
  - id: rear
references:
  - title: Rack installation specifications for racks that are not purchased from IBM (IBM Documentation, POWER9)
    url: https://www.ibm.com/docs/POWER9/p9had/p9had_oemrack.htm
  - title: 19-inch rack (Wikipedia)
    url: https://en.wikipedia.org/wiki/19-inch_rack
provenance:
  ru:
    confidence: estimated
    note: >-
      A stand-in: 42 is the height the Rack Builder gives a new generic frame.
      Neither page sets a height.
  numbering:
    confidence: estimated
    note: >-
      A stand-in: the Rack Builder's default, bottom-up from 1. Neither page
      says which way the labels run.
  width:
    confidence: estimated
    note: >-
      The IBM page and Wikipedia both describe the 19-inch rail. Read from those
      two pages, not from the standard.
  holes:
    confidence: estimated
    note: >-
      The style is a stand-in, the Rack Builder's default (square), and no
      thread is stated. The vertical pattern is sets of three holes spaced 15.9,
      15.9 and 12.7 mm on centre, 44.45 mm (1.75 in) per set, from the IBM page.
      Wikipedia lists the same three gaps as 12.70, 15.88 and 15.88 mm and the
      same 1.75 in unit.
  hole-centres:
    confidence: estimated
    note: >-
      465 mm between the hole lines of a rail pair, plus or minus 1.6 mm, as the
      IBM page states for racks it does not sell. Wikipedia gives 464.2 to 465.8
      mm for the same distance. The maker sheets recorded in
      docs/rack-products-design.md section 2 all give 465 mm where they print
      the figure; none of them is a cabinet's.
  opening:
    confidence: estimated
    note: >-
      450 mm minimum clear opening between the rails, as the IBM page states.
      Wikipedia gives 450.85 mm (17.75 in). The maker sheets recorded in
      docs/rack-products-design.md section 2 give 450 to 452 mm where they print
      one; none of them is a cabinet's.
gaps:
  - what: hole-centres
    reason: needs-drawing
    note: >-
      Read from a secondary source, the IBM page, with Wikipedia beside it. The
      EIA-310 text was not read, so the figure and its tolerance are not
      confirmed against the standard. No cabinet sheet was read for this shape.
    wanted: The EIA-310 text, or a cabinet maker's dimension drawing.
  - what: opening
    reason: needs-drawing
    note: >-
      Read from a secondary source, the IBM page, with Wikipedia beside it. The
      EIA-310 text was not read. IBM calls 450 mm a minimum and Wikipedia gives
      450.85 mm, so a real cabinet's opening varies.
    wanted: The EIA-310 text, or a cabinet maker's dimension drawing.
  - what: width
    reason: needs-drawing
    note: >-
      19 in is read from the IBM page and Wikipedia. The EIA-310 text was not read.
    wanted: The EIA-310 text.
  - what: width-23-in
    reason: vendor-silent
    note: >-
      The hole spacing and the opening of a 23-inch frame were not found, so
      this shape carries no 23-inch figure.
    wanted: A document that prints the hole centres and opening of a 23-inch rail.
  - what: ru
    reason: vendor-silent
    note: A generic cabinet has no height of its own; 42 is the Rack Builder's default.
    wanted: Nothing; a cabinet set from this shape takes the height it is given.
  - what: numbering
    reason: vendor-silent
    note: No page read says which way a generic cabinet's labels run.
    wanted: Nothing; a cabinet set from this shape takes the numbering it is given.
  - what: holes
    reason: vendor-silent
    note: >-
      The hole style is the Rack Builder's default. EIA-310 text was not read to
      see which styles it allows.
    wanted: The EIA-310 text.
  - what: rail-depth
    reason: vendor-silent
    note: >-
      The rail depth of a cabinet is adjustable in steps, and neither page gives
      a range or a step, so the rear rail states none and the shape states no
      `max-device-depth`. A maker's cabinet states both.
    wanted: Nothing; the range is the cabinet maker's, in its own product.
